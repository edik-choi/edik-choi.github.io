<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/><text x="60" y="80" font-size="44" fill="#1a1a1a" font-weight="bold" text-anchor="start">Advance and mail-in voting, Oct. 13-17</text><rect x="60" y="130" width="520" height="400" fill="#eef6b0" stroke="#8a9560" stroke-width="2"/><text x="320" y="290" font-size="100" fill="#2f6b0f" font-weight="bold" text-anchor="middle">1,356,873</text><text x="320" y="350" font-size="32" fill="#1a1a1a" font-weight="normal" text-anchor="middle">early votes in 2026</text><text x="320" y="440" font-size="44" fill="#a14d12" font-weight="bold" text-anchor="middle">43% of electors</text><rect x="620" y="130" width="520" height="400" fill="#eef6b0" stroke="#8a9560" stroke-width="2"/><text x="880" y="290" font-size="100" fill="#4a4a3a" font-weight="bold" text-anchor="middle">809,988</text><text x="880" y="350" font-size="32" fill="#1a1a1a" font-weight="normal" text-anchor="middle">at same point in 2023</text><text x="880" y="440" font-size="44" fill="#4a4a3a" font-weight="bold" text-anchor="middle">27.5% of electors</text><text x="60" y="590" font-size="32" fill="#4a4a3a" font-weight="normal" text-anchor="start">3,148,343 eligible electors; 519,082 were mailed-in special ballots</text><text x="60" y="640" font-size="28" fill="#5c6b40" font-weight="normal" text-anchor="start">Source: Global News, citing Elections Alberta</text></svg>