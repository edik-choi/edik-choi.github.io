<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/><text x="60" y="80" font-size="44" fill="#1a1a1a" font-weight="bold" text-anchor="start">2번 선택지 지지자들이 말하는 이유</text><text x="60" y="150" font-size="32" fill="#4a4a3a" font-weight="normal" text-anchor="start">앵거스리드 조사 중 향후 구속력 있는 주민투표 지지자</text><rect x="60" y="210" width="840" height="70" fill="#2f6b0f"/><text x="915" y="262" font-size="32" fill="#2f6b0f" font-weight="bold" text-anchor="start">60%</text><text x="60" y="200" font-size="32" fill="#1a1a1a" font-weight="bold" text-anchor="start">연방정부에 메시지 전달</text><rect x="60" y="390" width="518" height="70" fill="#a14d12"/><text x="593" y="442" font-size="32" fill="#a14d12" font-weight="bold" text-anchor="start">37%</text><text x="60" y="380" font-size="32" fill="#1a1a1a" font-weight="bold" text-anchor="start">주로 분리 자체</text><text x="60" y="560" font-size="32" fill="#4a4a3a" font-weight="normal" text-anchor="start">앨버타 주민 62%: 분리주의 운동은 끝나지 않을 것</text><text x="60" y="640" font-size="28" fill="#5c6b40" font-weight="normal" text-anchor="start">출처: Angus Reid Institute, 2026년 10월 16일</text></svg>