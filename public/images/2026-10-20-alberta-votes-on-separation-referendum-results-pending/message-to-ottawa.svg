<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/><text x="60" y="80" font-size="44" fill="#1a1a1a" font-weight="bold" text-anchor="start">What Option 2 supporters say it is about</text><text x="60" y="150" font-size="32" fill="#4a4a3a" font-weight="normal" text-anchor="start">Among Angus Reid respondents backing a future binding referendum</text><rect x="60" y="210" width="840" height="70" fill="#2f6b0f"/><text x="915" y="262" font-size="32" fill="#2f6b0f" font-weight="bold" text-anchor="start">60%</text><text x="60" y="200" font-size="32" fill="#1a1a1a" font-weight="bold" text-anchor="start">Sending a message to Ottawa</text><rect x="60" y="390" width="518" height="70" fill="#a14d12"/><text x="593" y="442" font-size="32" fill="#a14d12" font-weight="bold" text-anchor="start">37%</text><text x="60" y="380" font-size="32" fill="#1a1a1a" font-weight="bold" text-anchor="start">Mainly about separation</text><text x="60" y="560" font-size="32" fill="#4a4a3a" font-weight="normal" text-anchor="start">62% of Albertans say the separatist movement will never end</text><text x="60" y="640" font-size="28" fill="#5c6b40" font-weight="normal" text-anchor="start">Source: Angus Reid Institute, Oct. 16, 2026</text></svg>