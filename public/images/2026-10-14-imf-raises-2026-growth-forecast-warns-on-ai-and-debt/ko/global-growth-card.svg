<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<text x="60" y="90" font-size="40" font-weight="bold" fill="#1a1a1a">IMF 2026년 세계 성장률 전망</text>
<text x="600" y="360" font-size="240" font-weight="bold" fill="#2f6b0f" text-anchor="middle">3.1%</text>
<text x="600" y="440" font-size="40" fill="#1a1a1a" text-anchor="middle">7월 전망치 3.0%에서 상향</text>
<text x="600" y="510" font-size="36" fill="#1a1a1a" text-anchor="middle">2025년: 3.5%   |   2027년 전망: 3.4%</text>
<text x="60" y="635" font-size="28" fill="#4a4a3a">출처: IMF 전망에 관한 ABC News(AP), France 24(AFP) 보도</text>
</svg>
