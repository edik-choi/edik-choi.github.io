<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<text x="60" y="80" font-size="40" font-weight="bold" fill="#1a1a1a">세계 성장의 95%를 차지하는 국가 수</text>
<text x="300" y="330" font-size="200" font-weight="bold" fill="#4a4a3a" text-anchor="middle">54</text>
<text x="300" y="400" font-size="36" fill="#1a1a1a" text-anchor="middle">4월 기준</text>
<text x="600" y="320" font-size="100" fill="#1a1a1a" text-anchor="middle">→</text>
<text x="900" y="330" font-size="200" font-weight="bold" fill="#2f6b0f" text-anchor="middle">32</text>
<text x="900" y="400" font-size="36" fill="#1a1a1a" text-anchor="middle">10월</text>
<text x="600" y="520" font-size="36" fill="#1a1a1a" text-anchor="middle">세계 성장을 이끄는 나라가 줄고 있다</text>
<text x="60" y="635" font-size="28" fill="#4a4a3a">출처: IMF 전망에 관한 ABC News(AP) 보도</text>
</svg>
