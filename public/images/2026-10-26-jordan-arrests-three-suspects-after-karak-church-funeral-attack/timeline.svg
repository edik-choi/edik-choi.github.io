<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Karak church attack timeline</title>
<text x="600" y="80" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Karak church attack timeline</text><line x1="200" y1="340" x2="1000" y2="340" stroke="#8a9560" stroke-width="4"/><circle cx="200" cy="340" r="20" fill="#2f6b0f"/><text x="200" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#1a1a1a">Fri 23 Oct</text><text x="200" y="420" font-size="32" font-weight="400" text-anchor="middle" fill="#4a4a3a">Funeral attacked</text><circle cx="600" cy="340" r="20" fill="#2f6b0f"/><text x="600" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#1a1a1a">Sun 25 Oct</text><text x="600" y="420" font-size="32" font-weight="400" text-anchor="middle" fill="#4a4a3a">Victims' funeral</text><circle cx="1000" cy="340" r="20" fill="#a14d12"/><text x="1000" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#1a1a1a">Mon 26 Oct</text><text x="1000" y="420" font-size="32" font-weight="400" text-anchor="middle" fill="#4a4a3a">3 suspects arrested</text>
<text x="60" y="640" font-size="28" font-weight="400" text-anchor="start" fill="#5c6b40">Source: Al Jazeera, Asharq Al-Awsat, The Globe and Mail</text>
</svg>
