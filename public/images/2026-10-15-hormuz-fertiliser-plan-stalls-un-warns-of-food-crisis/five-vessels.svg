<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<text x="60" y="90" font-size="44" font-weight="bold" fill="#1a1a1a">The UN proposal in one number</text>
<rect x="60" y="130" width="1080" height="400" rx="16" fill="#eef6b0" stroke="#8a9560"/>
<text x="600" y="380" font-size="240" font-weight="bold" fill="#a14d12" text-anchor="middle">5</text>
<text x="600" y="450" font-size="38" fill="#1a1a1a" text-anchor="middle">vessels per day could keep fertiliser flowing</text>
<text x="600" y="500" font-size="32" fill="#4a4a3a" text-anchor="middle">to countries in critical need, per the UN official</text>
<text x="60" y="600" font-size="32" fill="#2f6b0f">Activation: 7 to 10 days after Iran and the US agree</text>
<text x="60" y="655" font-size="28" fill="#5c6b40">Source: Al Jazeera / Reuters</text></svg>
