<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<text x="60" y="80" font-size="44" font-weight="bold" fill="#1a1a1a">전쟁 전 호르무즈를 지나던 물동량</text>
<text x="60" y="130" font-size="30" fill="#4a4a3a">보도된 세계 교역 대비 대략적 비중</text>
<text x="60" y="235" font-size="32" fill="#1a1a1a">해상 황 물동량</text>
<rect x="60" y="255" width="1000" height="50" fill="#eef6b0" stroke="#8a9560"/><rect x="60" y="255" width="500" height="50" fill="#a14d12"/>
<text x="1180" y="292" font-size="32" font-weight="bold" fill="#1a1a1a" text-anchor="end">~절반</text>
<text x="60" y="390" font-size="32" fill="#1a1a1a">세계 요소 물동량</text>
<rect x="60" y="410" width="1000" height="50" fill="#eef6b0" stroke="#8a9560"/><rect x="60" y="410" width="333" height="50" fill="#2f6b0f"/>
<text x="1180" y="447" font-size="32" font-weight="bold" fill="#1a1a1a" text-anchor="end">~1/3</text>
<text x="60" y="545" font-size="32" fill="#1a1a1a">세계 비료 공급</text>
<rect x="60" y="565" width="1000" height="50" fill="#eef6b0" stroke="#8a9560"/><rect x="60" y="565" width="333" height="50" fill="#2f6b0f"/>
<text x="1180" y="602" font-size="32" font-weight="bold" fill="#1a1a1a" text-anchor="end">~1/3</text>
<text x="60" y="655" font-size="28" fill="#5c6b40">출처: Al Jazeera / Reuters; The New Arab (FAO)</text></svg>
