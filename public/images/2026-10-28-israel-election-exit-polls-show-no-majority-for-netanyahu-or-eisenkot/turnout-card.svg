<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Israel election turnout</title>
<text x="600" y="75" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Israel election turnout</text><rect x="150" y="130" width="900" height="440" rx="24" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/><text x="600" y="330" font-size="170" font-weight="700" text-anchor="middle" fill="#2f6b0f">77.7%</text><text x="600" y="405" font-size="36" text-anchor="middle" fill="#1a1a1a">turnout when polls closed</text><text x="600" y="470" font-size="30" font-weight="700" text-anchor="middle" fill="#a14d12">Highest since at least 1973</text><text x="600" y="525" font-size="30" text-anchor="middle" fill="#4a4a3a">Up 7.1 points from 2022</text><text x="60" y="640" font-size="28" font-weight="400" text-anchor="start" fill="#5c6b40">Source: The Jerusalem Post</text>
</svg>
