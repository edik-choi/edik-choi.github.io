<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Drone attack deaths in Sudan</title>
<text x="600" y="75" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Drone attack deaths in Sudan</text>
<rect x="150" y="120" width="900" height="420" rx="24" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/>
<text x="600" y="330" font-size="200" font-weight="700" text-anchor="middle" fill="#a14d12">160+</text>
<text x="600" y="400" font-size="36" text-anchor="middle" fill="#1a1a1a">reported killed in western regions</text>
<text x="600" y="452" font-size="32" text-anchor="middle" fill="#4a4a3a">since Friday 16 October 2026</text>
<text x="600" y="500" font-size="32" text-anchor="middle" fill="#4a4a3a">according to medics and rights groups</text>
<text x="60" y="640" font-size="28" text-anchor="start" fill="#5c6b40">Source: Al Jazeera; France 24 (AFP)</text>
</svg>
