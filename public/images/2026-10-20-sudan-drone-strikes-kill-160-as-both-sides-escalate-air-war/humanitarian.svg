<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>A war in its fourth year</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">A war in its fourth year</text>
<text x="600" y="115" font-size="30" text-anchor="middle" fill="#4a4a3a">War began in April 2023</text>
<rect x="60" y="170" width="345" height="360" rx="20" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/>
<text x="232" y="300" font-size="70" font-weight="700" text-anchor="middle" fill="#a14d12">13M</text>
<text x="232" y="380" font-size="32" text-anchor="middle" fill="#1a1a1a">people</text>
<text x="232" y="424" font-size="32" text-anchor="middle" fill="#1a1a1a">displaced</text>
<rect x="435" y="170" width="345" height="360" rx="20" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/>
<text x="607" y="300" font-size="70" font-weight="700" text-anchor="middle" fill="#2f6b0f">33.7M</text>
<text x="607" y="380" font-size="32" text-anchor="middle" fill="#1a1a1a">need food aid</text>
<text x="607" y="424" font-size="32" text-anchor="middle" fill="#1a1a1a">in 2026</text>
<rect x="810" y="170" width="345" height="360" rx="20" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/>
<text x="982" y="300" font-size="70" font-weight="700" text-anchor="middle" fill="#2f6b0f">825,000</text>
<text x="982" y="380" font-size="32" text-anchor="middle" fill="#1a1a1a">children severely</text>
<text x="982" y="424" font-size="32" text-anchor="middle" fill="#1a1a1a">malnourished</text>
<text x="60" y="640" font-size="28" text-anchor="start" fill="#5c6b40">Source: Al Jazeera (UN estimates)</text>
</svg>
