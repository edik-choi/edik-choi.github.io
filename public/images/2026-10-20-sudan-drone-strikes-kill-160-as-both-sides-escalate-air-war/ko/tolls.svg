<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>드론 한 번에 숨진 사람 수</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">드론 한 번에 숨진 사람 수</text>
<text x="600" y="115" font-size="30" text-anchor="middle" fill="#4a4a3a">2026년 10월 16~19일 보고된 사망자</text>
<text x="480" y="240" font-size="32" text-anchor="end" fill="#1a1a1a">서코르도판 알디밥</text>
<rect x="500" y="190" width="480" height="70" rx="6" fill="#a14d12"/>
<text x="996" y="240" font-size="36" font-weight="700" text-anchor="start" fill="#1a1a1a">80</text>
<text x="480" y="350" font-size="32" text-anchor="end" fill="#1a1a1a">블루나일주 국경 인근</text>
<rect x="500" y="300" width="246" height="70" rx="6" fill="#2f6b0f"/>
<text x="762" y="350" font-size="36" font-weight="700" text-anchor="start" fill="#1a1a1a">41</text>
<text x="480" y="460" font-size="32" text-anchor="end" fill="#1a1a1a">남다르푸르 니알라</text>
<rect x="500" y="410" width="102" height="70" rx="6" fill="#2f6b0f"/>
<text x="618" y="460" font-size="36" font-weight="700" text-anchor="start" fill="#1a1a1a">17</text>
<text x="480" y="570" font-size="32" text-anchor="end" fill="#1a1a1a">하르툼 나세르 확장구</text>
<rect x="500" y="520" width="24" height="70" rx="6" fill="#2f6b0f"/>
<text x="540" y="570" font-size="36" font-weight="700" text-anchor="start" fill="#1a1a1a">4</text>
<text x="60" y="640" font-size="28" text-anchor="start" fill="#5c6b40">출처: Al Jazeera; France 24 (AFP)</text>
</svg>
