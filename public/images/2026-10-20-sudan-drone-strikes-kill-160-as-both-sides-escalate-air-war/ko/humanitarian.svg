<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>4년째 이어지는 전쟁</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">4년째 이어지는 전쟁</text>
<text x="600" y="115" font-size="30" text-anchor="middle" fill="#4a4a3a">전쟁은 2023년 4월 시작</text>
<rect x="60" y="170" width="345" height="360" rx="20" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/>
<text x="232" y="300" font-size="70" font-weight="700" text-anchor="middle" fill="#a14d12">1,300만</text>
<text x="232" y="380" font-size="32" text-anchor="middle" fill="#1a1a1a">실향민</text>
<rect x="435" y="170" width="345" height="360" rx="20" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/>
<text x="607" y="300" font-size="70" font-weight="700" text-anchor="middle" fill="#2f6b0f">3,370만</text>
<text x="607" y="380" font-size="32" text-anchor="middle" fill="#1a1a1a">2026년 식량</text>
<text x="607" y="424" font-size="32" text-anchor="middle" fill="#1a1a1a">지원 필요</text>
<rect x="810" y="170" width="345" height="360" rx="20" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/>
<text x="982" y="300" font-size="70" font-weight="700" text-anchor="middle" fill="#2f6b0f">82만 5천</text>
<text x="982" y="380" font-size="32" text-anchor="middle" fill="#1a1a1a">아동 급성</text>
<text x="982" y="424" font-size="32" text-anchor="middle" fill="#1a1a1a">영양실조</text>
<text x="60" y="640" font-size="28" text-anchor="start" fill="#5c6b40">출처: Al Jazeera (유엔 추정)</text>
</svg>
