<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Four days of drone strikes</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Four days of drone strikes</text>
<text x="600" y="115" font-size="30" text-anchor="middle" fill="#4a4a3a">Tolls as reported by local sources</text>
<line x1="150" y1="330" x2="1050" y2="330" stroke="#8a9560" stroke-width="4"/>
<circle cx="150" cy="330" r="16" fill="#2f6b0f"/>
<text x="150" y="270" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">Fri 16 Oct</text>
<text x="150" y="400" font-size="32" text-anchor="middle" fill="#1a1a1a">Blue Nile:</text>
<text x="150" y="442" font-size="32" text-anchor="middle" fill="#1a1a1a">41 killed</text>
<circle cx="450" cy="330" r="16" fill="#a14d12"/>
<text x="450" y="270" font-size="32" font-weight="700" text-anchor="middle" fill="#a14d12">Sun 18 Oct</text>
<text x="450" y="400" font-size="32" text-anchor="middle" fill="#1a1a1a">Al-Dibab:</text>
<text x="450" y="442" font-size="32" text-anchor="middle" fill="#1a1a1a">80 killed</text>
<circle cx="750" cy="330" r="16" fill="#2f6b0f"/>
<text x="750" y="270" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">Mon 19 Oct</text>
<text x="750" y="400" font-size="32" text-anchor="middle" fill="#1a1a1a">Nyala:</text>
<text x="750" y="442" font-size="32" text-anchor="middle" fill="#1a1a1a">17 killed</text>
<circle cx="1050" cy="330" r="16" fill="#2f6b0f"/>
<text x="1050" y="270" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">Mon 19 Oct</text>
<text x="1050" y="400" font-size="32" text-anchor="middle" fill="#1a1a1a">UN condemns</text>
<text x="1050" y="442" font-size="32" text-anchor="middle" fill="#1a1a1a">the strikes</text>
<text x="60" y="640" font-size="28" text-anchor="start" fill="#5c6b40">Source: Al Jazeera; UN News</text>
</svg>
