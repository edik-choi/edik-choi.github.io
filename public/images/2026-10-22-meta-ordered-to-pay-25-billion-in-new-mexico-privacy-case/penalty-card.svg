<title>New Mexico judge's penalty against Meta</title>
<text x="600" y="110" font-size="44" font-weight="700" text-anchor="middle" fill="#1a1a1a">New Mexico judge's penalty against Meta</text><text x="600" y="350" font-size="160" font-weight="700" text-anchor="middle" fill="#a14d12">$25 billion</text><text x="600" y="450" font-size="38" font-weight="700" text-anchor="middle" fill="#2f6b0f">Judge Francis Mathew, Oct 21, 2026</text><text x="600" y="520" font-size="32" text-anchor="middle" fill="#4a4a3a">Law supported more than $219 billion; reduced to $25 billion</text>
<text x="60" y="640" font-size="28" text-anchor="start" fill="#5c6b40">Source: Al Jazeera, NBC News</text>
