<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>사건 경과</title>
<text x="600" y="75" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">사건 경과</text><line x1="120" y1="330" x2="1080" y2="330" stroke="#8a9560" stroke-width="4"/><circle cx="140" cy="330" r="16" fill="#2f6b0f"/><text x="140" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">2021</text><text x="140" y="400" font-size="28" text-anchor="middle" fill="#1a1a1a">주 정부 제소</text><circle cx="370" cy="330" r="16" fill="#2f6b0f"/><text x="370" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">2026.3</text><text x="370" y="400" font-size="28" text-anchor="middle" fill="#1a1a1a">배심 3.75억 달러</text><circle cx="600" cy="330" r="16" fill="#2f6b0f"/><text x="600" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">9월 25일</text><text x="600" y="400" font-size="28" text-anchor="middle" fill="#1a1a1a">배심 29건 중 26건</text><circle cx="830" cy="330" r="16" fill="#2f6b0f"/><text x="830" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">10월 1일</text><text x="830" y="400" font-size="28" text-anchor="middle" fill="#1a1a1a">벌금 심리</text><circle cx="1060" cy="330" r="16" fill="#a14d12"/><text x="1060" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#a14d12">10월 21일</text><text x="1060" y="400" font-size="28" text-anchor="middle" fill="#1a1a1a">250억 달러 부과</text>
<text x="60" y="640" font-size="28" text-anchor="start" fill="#5c6b40">출처: Al Jazeera, NBC News</text>
