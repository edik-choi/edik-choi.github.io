<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>뉴멕시코 판사가 메타에 부과한 벌금</title>
<text x="600" y="110" font-size="44" font-weight="700" text-anchor="middle" fill="#1a1a1a">뉴멕시코 판사가 메타에 부과한 벌금</text><text x="600" y="350" font-size="160" font-weight="700" text-anchor="middle" fill="#a14d12">250억 달러</text><text x="600" y="450" font-size="38" font-weight="700" text-anchor="middle" fill="#2f6b0f">프랜시스 매튜 판사, 2026년 10월 21일</text><text x="600" y="520" font-size="32" text-anchor="middle" fill="#4a4a3a">법상 2,190억 달러 이상 가능, 250억 달러로 감액</text>
<text x="60" y="640" font-size="28" text-anchor="start" fill="#5c6b40">출처: Al Jazeera, NBC News</text>
</svg>
