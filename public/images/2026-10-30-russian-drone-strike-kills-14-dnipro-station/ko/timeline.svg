<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="드니프로 공격 인포그래픽">
  <rect width="100%" height="100%" fill="#f6fcbb"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif" fill="#1a1a1a">

    <text x="60" y="92" font-size="42" font-weight="700">전쟁, 지역 휴전, 드니프로 공격</text>
    <line x1="125" y1="330" x2="1070" y2="330" stroke="#8a9560" stroke-width="8"/>
    <circle cx="160" cy="330" r="22" fill="#a14d12"/>
    <circle cx="485" cy="330" r="22" fill="#2f6b0f"/>
    <circle cx="790" cy="330" r="22" fill="#a14d12"/>
    <circle cx="1070" cy="330" r="22" fill="#2f6b0f"/>
    <text x="90" y="220" font-size="42" font-weight="700">2022년</text>
    <text x="90" y="270" font-size="30">전면 침공 시작</text>
    <text x="390" y="420" font-size="40" font-weight="700">10월 27일</text>
    <text x="350" y="465" font-size="30">헤르손 지역 휴전</text>
