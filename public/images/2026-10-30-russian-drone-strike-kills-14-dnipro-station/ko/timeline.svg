    <text x="690" y="270" font-size="30">드니프로 역 공격</text>
    <text x="1000" y="420" font-size="36" font-weight="700">11월</text>
    <text x="965" y="465" font-size="28">회담 예정</text>
  
  </g>
  <text x="60" y="635" font-size="28" fill="#5c6b40">출처: AP; Reuters</text>
</svg>