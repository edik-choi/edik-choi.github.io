<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Heaviest rain recorded</title>
<text x="600" y="80" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Heaviest rain recorded</text><rect x="150" y="130" width="900" height="420" rx="24" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/><text x="600" y="340" font-size="160" font-weight="700" text-anchor="middle" fill="#2f6b0f">632 mm</text><text x="600" y="420" font-size="38" font-weight="400" text-anchor="middle" fill="#1a1a1a">in 36 hours at Pego, Alicante</text><text x="600" y="480" font-size="34" font-weight="700" text-anchor="middle" fill="#a14d12">Oliva: 600 l/m² in 24 hours</text><text x="600" y="525" font-size="30" font-weight="400" text-anchor="middle" fill="#4a4a3a">Storm Adam, 17–20 October 2026</text><text x="60" y="640" font-size="28" font-weight="400" text-anchor="start" fill="#5c6b40">Source: Euronews, The Watchers</text>
</svg>
