<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Storm Adam: how it unfolded</title>
<text x="600" y="80" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Storm Adam: how it unfolded</text><line x1="270" y1="140" x2="270" y2="570" stroke="#8a9560" stroke-width="4"/><circle cx="270" cy="190" r="16" fill="#2f6b0f"/><text x="240" y="202" font-size="32" font-weight="700" text-anchor="end" fill="#2f6b0f">17 Oct</text><text x="310" y="202" font-size="32" font-weight="400" text-anchor="start" fill="#1a1a1a">First 112 incident logged</text><circle cx="270" cy="315" r="16" fill="#2f6b0f"/><text x="240" y="327" font-size="32" font-weight="700" text-anchor="end" fill="#2f6b0f">18 Oct</text><text x="310" y="327" font-size="32" font-weight="400" text-anchor="start" fill="#1a1a1a">AEMET warns of 300 mm in 12 h</text><circle cx="270" cy="440" r="16" fill="#2f6b0f"/><text x="240" y="452" font-size="32" font-weight="700" text-anchor="end" fill="#2f6b0f">19 Oct</text><text x="310" y="452" font-size="32" font-weight="400" text-anchor="start" fill="#1a1a1a">145 towns locked down, 1,000+ rescues</text><circle cx="270" cy="565" r="16" fill="#a14d12"/><text x="240" y="577" font-size="32" font-weight="700" text-anchor="end" fill="#a14d12">20 Oct</text><text x="310" y="577" font-size="32" font-weight="400" text-anchor="start" fill="#1a1a1a">Disaster zone announced</text><text x="60" y="640" font-size="28" font-weight="400" text-anchor="start" fill="#5c6b40">Source: Euronews, The Watchers</text>
</svg>
