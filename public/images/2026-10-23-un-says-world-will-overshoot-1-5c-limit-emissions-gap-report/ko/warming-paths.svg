<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>현재 계획이 가리키는 곳</title>
<text x="600" y="80" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">현재 계획이 가리키는 곳</text><text x="400" y="205" font-size="30" font-weight="400" text-anchor="end" fill="#1a1a1a">현행 정책</text><rect x="420" y="150" width="616" height="80" fill="#a14d12"/><text x="1052.0" y="205" font-size="36" font-weight="700" text-anchor="start" fill="#a14d12">2.8°C</text><text x="400" y="325" font-size="30" font-weight="400" text-anchor="end" fill="#1a1a1a">모든 국가 계획</text><rect x="420" y="270" width="572" height="80" fill="#2f6b0f"/><text x="1008.0" y="325" font-size="36" font-weight="700" text-anchor="start" fill="#2f6b0f">2.6°C</text><text x="400" y="445" font-size="30" font-weight="400" text-anchor="end" fill="#1a1a1a">계획+탄소중립</text><rect x="420" y="390" width="462" height="80" fill="#2f6b0f"/><text x="898.0" y="445" font-size="36" font-weight="700" text-anchor="start" fill="#2f6b0f">2.1°C</text><line x1="420" y1="130" x2="420" y2="520" stroke="#8a9560" stroke-width="3"/><line x1="750" y1="130" x2="750" y2="520" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="10 8"/><text x="750" y="560" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a">1.5°C 한도</text><text x="600" y="610" font-size="28" font-weight="400" text-anchor="middle" fill="#4a4a3a">2100년까지 예상 기온 상승</text>
<text x="60" y="640" font-size="28" font-weight="400" text-anchor="start" fill="#5c6b40">출처: UNEP via PBL, political.org</text>
