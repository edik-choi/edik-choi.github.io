<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Road to COP31</title>
<text x="600" y="80" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Road to COP31</text><line x1="100" y1="330" x2="1100" y2="330" stroke="#8a9560" stroke-width="4"/><circle cx="140" cy="330" r="16" fill="#2f6b0f"/><text x="140" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">2024</text><text x="140" y="395" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">First year</text><text x="140" y="430" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">above 1.5°C</text><circle cx="370" cy="330" r="16" fill="#2f6b0f"/><text x="370" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">Sep 2026</text><text x="370" y="395" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">UN confirms</text><text x="370" y="430" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">1.5°C missed</text><circle cx="600" cy="330" r="16" fill="#2f6b0f"/><text x="600" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">12 Oct</text><text x="600" y="395" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">EU draft</text><text x="600" y="430" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">COP31 plan</text><circle cx="830" cy="330" r="16" fill="#a14d12"/><text x="830" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#a14d12">21 Oct</text><text x="830" y="395" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">UNEP gap</text><text x="830" y="430" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">report</text><circle cx="1060" cy="330" r="16" fill="#2f6b0f"/><text x="1060" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">9–20 Nov</text><text x="1060" y="395" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">COP31</text><text x="1060" y="430" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">Antalya</text>
