<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Cuts needed vs. cuts pledged</title>
<text x="600" y="80" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Cuts needed vs. cuts pledged</text><text x="600" y="125" font-size="30" font-weight="400" text-anchor="middle" fill="#4a4a3a">Emission cuts vs 2025 levels</text><line x1="360" y1="150" x2="360" y2="590" stroke="#8a9560" stroke-width="3"/><text x="340" y="213" font-size="30" font-weight="400" text-anchor="end" fill="#1a1a1a">Needed by 2030</text><rect x="360" y="165" width="180" height="65" fill="#a14d12"/><text x="556" y="211" font-size="34" font-weight="700" text-anchor="start" fill="#a14d12">18%</text><text x="340" y="298" font-size="30" font-weight="400" text-anchor="end" fill="#1a1a1a">Pledged by 2030</text><rect x="360" y="250" width="80" height="65" fill="#2f6b0f"/><text x="456" y="296" font-size="34" font-weight="700" text-anchor="start" fill="#2f6b0f">5–8%</text><text x="340" y="383" font-size="30" font-weight="400" text-anchor="end" fill="#1a1a1a">Needed by 2035</text><rect x="360" y="335" width="450" height="65" fill="#a14d12"/><text x="826" y="381" font-size="34" font-weight="700" text-anchor="start" fill="#a14d12">45%</text><text x="340" y="468" font-size="30" font-weight="400" text-anchor="end" fill="#1a1a1a">Pledged by 2035</text><rect x="360" y="420" width="150" height="65" fill="#2f6b0f"/><text x="526" y="466" font-size="34" font-weight="700" text-anchor="start" fill="#2f6b0f">11–15%</text><text x="340" y="553" font-size="30" font-weight="400" text-anchor="end" fill="#1a1a1a">Needed by 2040</text><rect x="360" y="505" width="690" height="65" fill="#a14d12"/><text x="1066" y="551" font-size="34" font-weight="700" text-anchor="start" fill="#a14d12">69%</text>
<text x="60" y="640" font-size="28" font-weight="400" text-anchor="start" fill="#5c6b40">Source: UNEP via PBL, political.org</text>
