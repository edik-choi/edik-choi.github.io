<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Best case: 1.7–1.8°C peak warming</title>
<text x="600" y="80" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Best case: 1.7–1.8°C peak warming</text><text x="600" y="330" font-size="140" font-weight="700" text-anchor="middle" fill="#a14d12">1.7–1.8°C</text><text x="600" y="415" font-size="38" font-weight="700" text-anchor="middle" fill="#1a1a1a">Lowest possible peak warming, mid-century</text><text x="600" y="485" font-size="34" font-weight="400" text-anchor="middle" fill="#2f6b0f">Return to 1.5°C by 2100: about 50% chance</text><text x="600" y="545" font-size="32" font-weight="400" text-anchor="middle" fill="#4a4a3a">Limited overshoot of 1.5°C is "gone"</text>
<text x="60" y="640" font-size="28" font-weight="400" text-anchor="start" fill="#5c6b40">Source: UNEP via Down To Earth, PBL</text>
</svg>
