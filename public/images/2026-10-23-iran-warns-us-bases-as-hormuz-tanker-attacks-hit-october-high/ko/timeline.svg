<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#f6fcbb"/>
<text x="600" y="80" font-size="40" fill="#1a1a1a" font-weight="bold" text-anchor="middle">10월까지 이어진 호르무즈 대치</text><line x1="100" y1="330" x2="1100" y2="330" stroke="#8a9560" stroke-width="4"/><circle cx="140" cy="330" r="18" fill="#2f6b0f"/><text x="140" y="270" font-size="34" fill="#2f6b0f" font-weight="bold" text-anchor="middle">2월 28일</text><text x="140" y="395" font-size="30" fill="#1a1a1a" font-weight="normal" text-anchor="middle">전쟁 시작</text><circle cx="370" cy="330" r="18" fill="#2f6b0f"/><text x="370" y="270" font-size="34" fill="#2f6b0f" font-weight="bold" text-anchor="middle">6월</text><text x="370" y="395" font-size="30" fill="#1a1a1a" font-weight="normal" text-anchor="middle">합의 체결,</text><text x="370" y="433" font-size="30" fill="#1a1a1a" font-weight="normal" text-anchor="middle">곧 무산</text><circle cx="600" cy="330" r="18" fill="#2f6b0f"/><text x="600" y="270" font-size="34" fill="#2f6b0f" font-weight="bold" text-anchor="middle">7월 14일</text><text x="600" y="395" font-size="30" fill="#1a1a1a" font-weight="normal" text-anchor="middle">미 봉쇄</text><text x="600" y="433" font-size="30" fill="#1a1a1a" font-weight="normal" text-anchor="middle">엄격 집행</text><circle cx="830" cy="330" r="18" fill="#a14d12"/><text x="830" y="270" font-size="34" fill="#a14d12" font-weight="bold" text-anchor="middle">10월 22일</text><text x="830" y="395" font-size="30" fill="#1a1a1a" font-weight="normal" text-anchor="middle">혁명수비대</text><text x="830" y="433" font-size="30" fill="#1a1a1a" font-weight="normal" text-anchor="middle">기지 경고</text><circle cx="1060" cy="330" r="18" fill="#2f6b0f"/><text x="1060" y="270" font-size="34" fill="#2f6b0f" font-weight="bold" text-anchor="middle">11월 3일</text><text x="1060" y="395" font-size="30" fill="#1a1a1a" font-weight="normal" text-anchor="middle">미국</text><text x="1060" y="433" font-size="30" fill="#1a1a1a" font-weight="normal" text-anchor="middle">중간선거</text><text x="60" y="640" font-size="28" fill="#5c6b40" font-weight="normal" text-anchor="start">출처: AP, Fox News</text>
</svg>
