<line x1="120" y1="330" x2="1080" y2="330" stroke="#8a9560" stroke-width="4"/>
<circle cx="200" cy="330" r="22" fill="#2f6b0f"/><circle cx="600" cy="330" r="22" fill="#2f6b0f"/><circle cx="1000" cy="330" r="22" fill="#a14d12"/>
<rect x="60" y="130" width="280" height="150" rx="16" fill="#eef6b0" stroke="#8a9560"/>
<text x="200" y="185" text-anchor="middle" font-size="34" font-weight="bold" fill="#1a1a1a">June</text>
<text x="200" y="230" text-anchor="middle" font-size="28" fill="#1a1a1a">US asks Anthropic to</text>
