<text x="600" y="480" text-anchor="middle" font-size="28" fill="#1a1a1a">FT: Beijing weighs</text>
<text x="600" y="512" text-anchor="middle" font-size="28" fill="#1a1a1a">curbs on AI and chips</text>
<rect x="860" y="130" width="280" height="150" rx="16" fill="#eef6b0" stroke="#8a9560"/>
<text x="1000" y="185" text-anchor="middle" font-size="34" font-weight="bold" fill="#a14d12">16 October</text>
<text x="1000" y="230" text-anchor="middle" font-size="28" fill="#1a1a1a">Draft list of 40</text>
<text x="1000" y="262" text-anchor="middle" font-size="28" fill="#1a1a1a">technologies published</text>
<text x="40" y="645" font-size="28" fill="#5c6b40">Source: Associated Press; The Next Web (citing FT)</text></svg>
