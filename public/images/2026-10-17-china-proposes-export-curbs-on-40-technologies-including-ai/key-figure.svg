<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Key figure: 40 technologies in China's draft export catalogue update"><rect width="100%" height="100%" fill="#f6fcbb"/>
