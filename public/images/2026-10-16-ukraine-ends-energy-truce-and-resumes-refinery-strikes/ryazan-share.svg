<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Key figure: the Ryazan refinery handles nearly 5% of Russia's refinery throughput">
<rect width="100%" height="100%" fill="#f6fcbb"/>
<rect x="60" y="60" width="1080" height="500" rx="24" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/>
<text x="600" y="330" font-size="190" font-weight="bold" fill="#2f6b0f" text-anchor="middle">Nearly 5%</text>
<text x="600" y="420" font-size="38" fill="#1a1a1a" text-anchor="middle">of Russia's refinery throughput</text>
<text x="600" y="475" font-size="34" fill="#4a4a3a" text-anchor="middle">passes through the Ryazan refinery,</text>
<text x="600" y="520" font-size="34" fill="#a14d12" text-anchor="middle">hit by a drone attack on 15 October</text>
<text x="60" y="630" font-size="28" fill="#5c6b40">Source: Reuters</text>
</svg>
