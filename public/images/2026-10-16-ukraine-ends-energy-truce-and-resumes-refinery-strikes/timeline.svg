<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Timeline of the energy ceasefire, 9 to 15 October 2026">
<rect width="100%" height="100%" fill="#f6fcbb"/>
<text x="60" y="75" font-size="44" font-weight="bold" fill="#1a1a1a">Six days from deal to collapse</text>
<line x1="250" y1="150" x2="250" y2="560" stroke="#8a9560" stroke-width="4"/>
<circle cx="250" cy="170" r="14" fill="#2f6b0f"/><circle cx="250" cy="295" r="14" fill="#2f6b0f"/><circle cx="250" cy="420" r="14" fill="#2f6b0f"/><circle cx="250" cy="545" r="14" fill="#a14d12"/>
<text x="60" y="182" font-size="36" font-weight="bold" fill="#2f6b0f">9 Oct</text>
<text x="290" y="170" font-size="30" fill="#1a1a1a">Trump announces diesel deal with Russia:</text>
<text x="290" y="210" font-size="30" fill="#4a4a3a">over 300,000 tonnes of diesel</text>
<text x="60" y="307" font-size="36" font-weight="bold" fill="#2f6b0f">10 Oct</text>
<text x="290" y="295" font-size="30" fill="#1a1a1a">Trump warns Kyiv to stop refinery attacks</text>
<text x="290" y="335" font-size="30" fill="#4a4a3a">and urges Ukraine to replace its leader</text>
<text x="60" y="432" font-size="36" font-weight="bold" fill="#2f6b0f">11 Oct</text>
<text x="290" y="420" font-size="30" fill="#1a1a1a">Trump announces an energy ceasefire;</text>
<text x="290" y="460" font-size="30" fill="#4a4a3a">Kyiv pauses refinery strikes</text>
<text x="60" y="557" font-size="36" font-weight="bold" fill="#a14d12">15 Oct</text>
<text x="290" y="545" font-size="30" fill="#1a1a1a">Zelensky: "The block is out. We're done."</text>
<text x="290" y="585" font-size="30" fill="#a14d12">Fire reported at Ryazan refinery</text>
<text x="60" y="645" font-size="28" fill="#5c6b40">Source: Reuters, NBC News</text>
</svg>
