<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Key figure: more than 850 Russian drones in Ukraine's skies since early Thursday">
<rect width="100%" height="100%" fill="#f6fcbb"/>
<rect x="60" y="60" width="1080" height="500" rx="24" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/>
<text x="600" y="330" font-size="220" font-weight="bold" fill="#a14d12" text-anchor="middle">850+</text>
<text x="600" y="420" font-size="38" fill="#1a1a1a" text-anchor="middle">Russian drones in Ukraine's skies</text>
<text x="600" y="475" font-size="34" fill="#4a4a3a" text-anchor="middle">since early Thursday 15 October,</text>
<text x="600" y="520" font-size="34" fill="#4a4a3a" text-anchor="middle">according to Zelensky</text>
<text x="60" y="630" font-size="28" fill="#5c6b40">Source: NBC News</text>
</svg>
