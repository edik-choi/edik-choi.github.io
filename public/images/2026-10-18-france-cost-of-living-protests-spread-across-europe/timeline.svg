<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Timeline of the protest wave</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">From a school gate to a national day</text>
<line x1="150" y1="330" x2="1050" y2="330" stroke="#8a9560" stroke-width="4"/>
<circle cx="150" cy="330" r="16" fill="#2f6b0f"/><circle cx="500" cy="330" r="16" fill="#2f6b0f"/><circle cx="800" cy="330" r="16" fill="#2f6b0f"/><circle cx="1050" cy="330" r="16" fill="#a14d12"/>
<text x="150" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">Mid-Sept</text>
<text x="150" y="400" font-size="30" text-anchor="middle" fill="#1a1a1a">Students protest</text><text x="150" y="440" font-size="30" text-anchor="middle" fill="#1a1a1a">in Créteil</text>
<text x="500" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">5 Oct</text>
<text x="500" y="400" font-size="30" text-anchor="middle" fill="#1a1a1a">Teen injured at</text><text x="500" y="440" font-size="30" text-anchor="middle" fill="#1a1a1a">protest in Lens</text>
<text x="800" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">16 Oct</text>
<text x="800" y="400" font-size="30" text-anchor="middle" fill="#1a1a1a">Macron appeals</text><text x="800" y="440" font-size="30" text-anchor="middle" fill="#1a1a1a">for calm</text>
<text x="1050" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#a14d12">17 Oct</text>
<text x="1050" y="400" font-size="30" text-anchor="middle" fill="#1a1a1a">Nationwide</text><text x="1050" y="440" font-size="30" text-anchor="middle" fill="#1a1a1a">protest day</text>
<text x="60" y="650" font-size="28" fill="#5c6b40">Source: Al Jazeera; Euronews</text>
</svg>
