<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>시위 물결 타임라인</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">학교 앞에서 전국 시위의 날까지</text>
<line x1="150" y1="330" x2="1050" y2="330" stroke="#8a9560" stroke-width="4"/>
<circle cx="150" cy="330" r="16" fill="#2f6b0f"/><circle cx="500" cy="330" r="16" fill="#2f6b0f"/><circle cx="800" cy="330" r="16" fill="#2f6b0f"/><circle cx="1050" cy="330" r="16" fill="#a14d12"/>
<text x="150" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">9월 중순</text>
<text x="150" y="400" font-size="30" text-anchor="middle" fill="#1a1a1a">크레테유에서</text><text x="150" y="440" font-size="30" text-anchor="middle" fill="#1a1a1a">학생 시위</text>
<text x="500" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">10월 5일</text>
<text x="500" y="400" font-size="30" text-anchor="middle" fill="#1a1a1a">랑스 시위에서</text><text x="500" y="440" font-size="30" text-anchor="middle" fill="#1a1a1a">10대 부상</text>
<text x="800" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">10월 16일</text>
<text x="800" y="400" font-size="30" text-anchor="middle" fill="#1a1a1a">마크롱,</text><text x="800" y="440" font-size="30" text-anchor="middle" fill="#1a1a1a">자제 호소</text>
<text x="1050" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#a14d12">10월 17일</text>
<text x="1050" y="400" font-size="30" text-anchor="middle" fill="#1a1a1a">전국</text><text x="1050" y="440" font-size="30" text-anchor="middle" fill="#1a1a1a">시위의 날</text>
<text x="60" y="650" font-size="28" fill="#5c6b40">출처: Al Jazeera; Euronews</text>
</svg>
