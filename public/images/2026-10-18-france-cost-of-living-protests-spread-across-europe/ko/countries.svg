<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>4개국의 시위</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">4개국, 각각 따로 열린 시위</text>
<rect x="60" y="120" width="520" height="210" rx="20" fill="#eef6b0" stroke="#a14d12" stroke-width="4"/>
<text x="320" y="185" font-size="38" font-weight="700" text-anchor="middle" fill="#a14d12">프랑스</text>
<text x="320" y="240" font-size="30" text-anchor="middle" fill="#1a1a1a">55만 명 이상 행진</text><text x="320" y="285" font-size="30" text-anchor="middle" fill="#1a1a1a">(내무부 집계)</text>
<rect x="620" y="120" width="520" height="210" rx="20" fill="#eef6b0" stroke="#8a9560" stroke-width="2"/>
<text x="880" y="185" font-size="38" font-weight="700" text-anchor="middle" fill="#2f6b0f">벨기에</text>
<text x="880" y="240" font-size="30" text-anchor="middle" fill="#1a1a1a">브뤼셀에서 최루탄,</text><text x="880" y="285" font-size="30" text-anchor="middle" fill="#1a1a1a">물대포 사용</text>
<rect x="60" y="360" width="520" height="210" rx="20" fill="#eef6b0" stroke="#8a9560" stroke-width="2"/>
<text x="320" y="425" font-size="38" font-weight="700" text-anchor="middle" fill="#2f6b0f">이탈리아</text>
<text x="320" y="480" font-size="30" text-anchor="middle" fill="#1a1a1a">밀라노·볼로냐에서</text><text x="320" y="525" font-size="30" text-anchor="middle" fill="#1a1a1a">집회와 충돌</text>
<rect x="620" y="360" width="520" height="210" rx="20" fill="#eef6b0" stroke="#8a9560" stroke-width="2"/>
<text x="880" y="425" font-size="38" font-weight="700" text-anchor="middle" fill="#2f6b0f">포르투갈</text>
<text x="880" y="480" font-size="30" text-anchor="middle" fill="#1a1a1a">리스본에서</text><text x="880" y="525" font-size="30" text-anchor="middle" fill="#1a1a1a">수만 명 행진</text>
<text x="60" y="640" font-size="28" fill="#5c6b40">출처: Al Jazeera</text>
</svg>
