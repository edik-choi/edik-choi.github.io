<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>10월 유일한 여론조사, 학생 측이 근소 우위</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">10월 유일한 여론조사, 학생 측이 근소 우위</text><text x="600" y="115" font-size="30" font-weight="400" text-anchor="middle" fill="#4a4a3a">득표율, NSPM 조사, 10월 20일</text><line x1="430" y1="150" x2="430" y2="560" stroke="#8a9560" stroke-width="3"/><text x="410" y="238" font-size="28" font-weight="400" text-anchor="end" fill="#1a1a1a">학생 명부</text><rect x="430" y="180" width="534" height="84" fill="#2f6b0f"/><text x="980" y="238" font-size="36" font-weight="700" text-anchor="start" fill="#2f6b0f">44.5%</text><text x="410" y="368" font-size="28" font-weight="400" text-anchor="end" fill="#1a1a1a">세르비아진보당(SNS)</text><rect x="430" y="310" width="512" height="84" fill="#a14d12"/><text x="958" y="368" font-size="36" font-weight="700" text-anchor="start" fill="#a14d12">42.7%</text><text x="60" y="640" font-size="28" font-weight="400" fill="#5c6b40">출처: Reuters</text>
</svg>
