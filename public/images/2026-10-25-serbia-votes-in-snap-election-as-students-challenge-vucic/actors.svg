<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Two camps, one vote</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Two camps, one vote</text><rect x="60" y="150" width="480" height="330" rx="20" fill="#eef6b0" stroke="#a14d12" stroke-width="3"/><text x="300" y="225" font-size="32" font-weight="700" text-anchor="middle" fill="#a14d12">Serbian Progressive Party</text><text x="300" y="300" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">Ruled for 14 years</text><text x="300" y="360" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">Leader: Aleksandar Vucic</text><rect x="660" y="150" width="480" height="330" rx="20" fill="#eef6b0" stroke="#2f6b0f" stroke-width="3"/><text x="900" y="225" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">Students’ List</text><text x="900" y="300" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">250 candidates</text><text x="900" y="360" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">Head: Ilija Srdanovic</text><text x="600" y="330" font-size="32" font-weight="700" text-anchor="middle" fill="#4a4a3a">VS</text><text x="600" y="560" font-size="32" font-weight="700" text-anchor="middle" fill="#1a1a1a">250 seats in parliament</text><text x="60" y="640" font-size="28" font-weight="400" fill="#5c6b40">Source: Reuters</text>
</svg>
