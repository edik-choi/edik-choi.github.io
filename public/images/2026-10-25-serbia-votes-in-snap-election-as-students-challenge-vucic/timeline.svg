<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>From a station collapse to a snap election</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">From a station collapse to a snap election</text><line x1="100" y1="330" x2="1100" y2="330" stroke="#8a9560" stroke-width="4"/><circle cx="140" cy="330" r="16" fill="#2f6b0f"/><text x="140" y="270" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">Nov 2024</text><text x="140" y="395" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">Novi Sad</text><text x="140" y="433" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">canopy</text><text x="140" y="471" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">collapse</text><text x="140" y="509" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">kills 16</text><circle cx="360" cy="330" r="16" fill="#2f6b0f"/><text x="360" y="270" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">Jan 2025</text><text x="360" y="395" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">PM Vucevic</text><text x="360" y="433" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">resigns</text><circle cx="580" cy="330" r="16" fill="#2f6b0f"/><text x="580" y="270" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">Mar 2025</text><text x="580" y="395" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">Hundreds of</text><text x="580" y="433" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">thousands</text><text x="580" y="471" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">march</text><circle cx="800" cy="330" r="16" fill="#2f6b0f"/><text x="800" y="270" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">Sep 2026</text><text x="800" y="395" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">Vucic quits</text><text x="800" y="433" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">presidency to</text><text x="800" y="471" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">run</text><circle cx="1020" cy="330" r="16" fill="#a14d12"/><text x="1020" y="270" font-size="32" font-weight="700" text-anchor="middle" fill="#a14d12">25 Oct 2026</text><text x="1020" y="395" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">Snap</text><text x="1020" y="433" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">parliamentary</text><text x="1020" y="471" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">vote</text><text x="60" y="640" font-size="28" font-weight="400" fill="#5c6b40">Source: Reuters</text>
</svg>
