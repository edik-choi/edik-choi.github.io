<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Bar chart of WHO funding secured versus needed"><rect width="100%" height="100%" fill="#f6fcbb"/>
<text x="60" y="80" font-size="44" fill="#1a1a1a" font-weight="bold" text-anchor="start">WHO 90-day emergency response: funding</text>
<text x="60" y="125" font-size="30" fill="#4a4a3a" font-weight="normal" text-anchor="start">$3.78 million secured of $31 million needed</text>
<rect x="60" y="230" width="1080" height="120" fill="#eef6b0" stroke="#8a9560" stroke-width="2"/>
<rect x="60" y="230" width="132" height="120" fill="#a14d12"/>
<text x="60" y="420" font-size="36" fill="#a14d12" font-weight="bold" text-anchor="start">Secured: $3.78 million</text>
<text x="1140" y="420" font-size="36" fill="#1a1a1a" font-weight="bold" text-anchor="end">Needed: $31 million</text>
<text x="60" y="500" font-size="30" fill="#4a4a3a" font-weight="normal" text-anchor="start">Funds would expand surveillance in displacement sites,</text>
<text x="60" y="545" font-size="30" fill="#4a4a3a" font-weight="normal" text-anchor="start">deploy rapid response teams and strengthen treatment.</text>
<text x="60" y="640" font-size="28" fill="#5c6b40" font-weight="normal" text-anchor="start">Source: Al Jazeera, The New Arab (citing WHO)</text>
</svg>