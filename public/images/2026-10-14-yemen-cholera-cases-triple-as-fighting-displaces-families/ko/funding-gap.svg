<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif" role="img" aria-label="Bar chart of WHO funding secured versus needed"><rect width="100%" height="100%" fill="#f6fcbb"/>
<text x="60" y="80" font-size="44" fill="#1a1a1a" font-weight="bold" text-anchor="start">WHO 90일 긴급 대응 자금</text>
<text x="60" y="125" font-size="30" fill="#4a4a3a" font-weight="normal" text-anchor="start">필요한 3,100만 달러 중 378만 달러 확보</text>
<rect x="60" y="230" width="1080" height="120" fill="#eef6b0" stroke="#8a9560" stroke-width="2"/>
<rect x="60" y="230" width="132" height="120" fill="#a14d12"/>
<text x="60" y="420" font-size="36" fill="#a14d12" font-weight="bold" text-anchor="start">확보: 378만 달러</text>
<text x="1140" y="420" font-size="36" fill="#1a1a1a" font-weight="bold" text-anchor="end">필요: 3,100만 달러</text>
