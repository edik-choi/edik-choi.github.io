<title>How the squeeze built up</title>
<text x="600" y="75" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">How the squeeze built up</text><line x1="290" y1="130" x2="290" y2="590" stroke="#8a9560" stroke-width="3"/><text x="260" y="180" font-size="32" font-weight="700" text-anchor="end" fill="#a14d12">March</text><circle cx="290" cy="170" r="12" fill="#2f6b0f"/><text x="325" y="180" font-size="30" font-weight="400" text-anchor="start" fill="#1a1a1a">G7 agrees 400m-barrel emergency stock release</text><text x="260" y="280" font-size="32" font-weight="700" text-anchor="end" fill="#a14d12">23 Apr</text><circle cx="290" cy="270" r="12" fill="#2f6b0f"/><text x="325" y="280" font-size="30" font-weight="400" text-anchor="start" fill="#1a1a1a">Refill season opens at 31 bcm, lowest since 2018</text><text x="260" y="380" font-size="32" font-weight="700" text-anchor="end" fill="#a14d12">29 Sep</text><circle cx="290" cy="370" r="12" fill="#2f6b0f"/><text x="325" y="380" font-size="30" font-weight="400" text-anchor="start" fill="#1a1a1a">EU average diesel hits a record €2.23 a litre</text><text x="260" y="480" font-size="32" font-weight="700" text-anchor="end" fill="#a14d12">23 Oct</text><circle cx="290" cy="470" r="12" fill="#2f6b0f"/><text x="325" y="480" font-size="30" font-weight="400" text-anchor="start" fill="#1a1a1a">IEA’s Birol: EU gas storage ~72% vs ~90% usual</text><text x="260" y="580" font-size="32" font-weight="700" text-anchor="end" fill="#a14d12">Winter</text><circle cx="290" cy="570" r="12" fill="#2f6b0f"/><text x="325" y="580" font-size="30" font-weight="400" text-anchor="start" fill="#1a1a1a">EU ministers reportedly weigh rationing</text><text x="60" y="640" font-size="28" font-weight="400" text-anchor="start" fill="#5c6b40">Source: Al Jazeera, Euronews, Columbia CGEP</text>
