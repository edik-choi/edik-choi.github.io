<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>EU diesel price hits a record</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">EU diesel price hits a record</text><text x="600" y="115" font-size="30" font-weight="400" text-anchor="middle" fill="#4a4a3a">Euros per litre, week before 29 September</text><line x1="430" y1="150" x2="430" y2="560" stroke="#8a9560" stroke-width="3"/><text x="410" y="238" font-size="32" font-weight="400" text-anchor="end" fill="#1a1a1a">EU average</text><rect x="430" y="180" width="470" height="84" fill="#2f6b0f"/><text x="916" y="238" font-size="36" font-weight="700" text-anchor="start" fill="#2f6b0f">€2.23</text><text x="410" y="368" font-size="32" font-weight="400" text-anchor="end" fill="#1a1a1a">France</text><rect x="430" y="310" width="506" height="84" fill="#2f6b0f"/><text x="952" y="368" font-size="36" font-weight="700" text-anchor="start" fill="#2f6b0f">€2.40</text><text x="410" y="498" font-size="32" font-weight="400" text-anchor="end" fill="#1a1a1a">Denmark</text><rect x="430" y="440" width="540" height="84" fill="#a14d12"/><text x="986" y="498" font-size="36" font-weight="700" text-anchor="start" fill="#a14d12">€2.56</text><text x="60" y="640" font-size="28" font-weight="400" text-anchor="start" fill="#5c6b40">Source: Euronews</text>
</svg>
