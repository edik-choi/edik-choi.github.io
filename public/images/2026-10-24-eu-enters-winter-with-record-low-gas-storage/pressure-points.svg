<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Pressure points on Europe’s winter supply</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Pressure points on Europe’s winter supply</text><line x1="300" y1="280" x2="480" y2="320" stroke="#8a9560" stroke-width="3"/><line x1="900" y1="280" x2="720" y2="320" stroke="#8a9560" stroke-width="3"/><line x1="300" y1="450" x2="480" y2="355" stroke="#8a9560" stroke-width="3"/><line x1="900" y1="450" x2="720" y2="355" stroke="#8a9560" stroke-width="3"/><rect x="40" y="130" width="520" height="150" rx="16" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/><text x="300" y="175" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">Strait of Hormuz</text><text x="300" y="218" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">About a tenth of Europe’s LNG</text><text x="300" y="254" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">passed through it pre-war</text><rect x="640" y="130" width="520" height="150" rx="16" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/><text x="900" y="175" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">Asian competition</text><text x="900" y="218" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">Asia, more Gulf-dependent,</text><text x="900" y="254" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">competes for the same LNG</text><rect x="40" y="450" width="520" height="150" rx="16" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/><text x="300" y="495" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">Russian refineries</text><text x="300" y="538" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">Ukrainian strikes cut about</text><text x="300" y="574" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">a third of deliveries</text><rect x="640" y="450" width="520" height="150" rx="16" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/><text x="900" y="495" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">Bab al-Mandeb strait</text><text x="900" y="538" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">Flare-ups have worsened</text><text x="900" y="574" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">the supply picture</text><rect x="480" y="290" width="240" height="95" rx="16" fill="#eef6b0" stroke="#a14d12" stroke-width="4"/><text x="600" y="330" font-size="30" font-weight="700" text-anchor="middle" fill="#a14d12">EU winter</text><text x="600" y="368" font-size="30" font-weight="700" text-anchor="middle" fill="#a14d12">energy supply</text><text x="60" y="640" font-size="28" font-weight="400" text-anchor="start" fill="#5c6b40">Source: Al Jazeera</text>
</svg>
