<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>유럽 겨울 공급을 누르는 요인</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">유럽 겨울 공급을 누르는 요인</text><line x1="300" y1="280" x2="480" y2="320" stroke="#8a9560" stroke-width="3"/><line x1="900" y1="280" x2="720" y2="320" stroke="#8a9560" stroke-width="3"/><line x1="300" y1="450" x2="480" y2="355" stroke="#8a9560" stroke-width="3"/><line x1="900" y1="450" x2="720" y2="355" stroke="#8a9560" stroke-width="3"/><rect x="40" y="130" width="520" height="150" rx="16" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/><text x="300" y="175" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">호르무즈 해협</text><text x="300" y="218" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">전쟁 전 유럽 LNG의</text><text x="300" y="254" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">약 10분의 1 통과</text><rect x="640" y="130" width="520" height="150" rx="16" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/><text x="900" y="175" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">아시아와의 경쟁</text><text x="900" y="218" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">중동 의존도 높은 아시아와</text><text x="900" y="254" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">같은 LNG를 놓고 경쟁</text><rect x="40" y="450" width="520" height="150" rx="16" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/><text x="300" y="495" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">러시아 정유시설</text><text x="300" y="538" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">우크라이나 공격으로</text><text x="300" y="574" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">공급 약 3분의 1 감소</text><rect x="640" y="450" width="520" height="150" rx="16" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/><text x="900" y="495" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">밥엘만데브 해협</text><text x="900" y="538" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">긴장 고조로 공급</text><text x="900" y="574" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">상황이 더 악화</text><rect x="480" y="290" width="240" height="95" rx="16" fill="#eef6b0" stroke="#a14d12" stroke-width="4"/><text x="600" y="330" font-size="30" font-weight="700" text-anchor="middle" fill="#a14d12">EU의 겨울</text><text x="600" y="368" font-size="30" font-weight="700" text-anchor="middle" fill="#a14d12">에너지 공급</text><text x="60" y="640" font-size="28" font-weight="400" text-anchor="start" fill="#5c6b40">출처: Al Jazeera</text>
</svg>
