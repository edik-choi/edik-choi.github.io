<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>겨울 앞둔 유럽의 가스 비축량</title>
<text x="600" y="80" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">겨울 앞둔 유럽의 가스 비축량</text><rect x="150" y="130" width="900" height="440" rx="24" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/><text x="600" y="330" font-size="170" font-weight="700" text-anchor="middle" fill="#2f6b0f">72%</text><text x="600" y="405" font-size="36" font-weight="400" text-anchor="middle" fill="#1a1a1a">EU 가스 저장고 충전율 (평년 약 90%)</text><text x="600" y="470" font-size="34" font-weight="700" text-anchor="middle" fill="#a14d12">부족분 = 1,000만~1,200만 가구 에너지</text><text x="600" y="525" font-size="30" font-weight="400" text-anchor="middle" fill="#4a4a3a">2월 이후 가스 가격 140% 상승</text><text x="60" y="640" font-size="28" font-weight="400" text-anchor="start" fill="#5c6b40">출처: Al Jazeera</text>
</svg>
