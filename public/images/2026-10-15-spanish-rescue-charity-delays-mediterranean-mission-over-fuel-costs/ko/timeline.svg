<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<text x="60" y="85" font-size="44" font-weight="bold" fill="#1a1a1a">이란 전쟁에서 구조 활동 연기까지</text>
<line x1="150" y1="340" x2="1050" y2="340" stroke="#8a9560" stroke-width="4"/>
<g fill="#2f6b0f"><circle cx="150" cy="340" r="16"/><circle cx="450" cy="340" r="16"/><circle cx="750" cy="340" r="16"/></g>
<circle cx="1050" cy="340" r="20" fill="#a14d12"/>
<g font-size="32" font-weight="bold" fill="#1a1a1a" text-anchor="middle"><text x="150" y="290">2월 말</text><text x="450" y="290">3월</text><text x="750" y="290">이후</text><text x="1050" y="290" fill="#a14d12">10월 14일</text></g>
<g font-size="30" fill="#1a1a1a" text-anchor="middle"><text x="150" y="400">미국·이스라엘</text><text x="150" y="440">이란 공격</text><text x="450" y="400">선박 연료</text><text x="450" y="440">사상 최고</text><text x="750" y="400">가격 다소 하락,</text><text x="750" y="440">변동성 지속</text><text x="1050" y="400">SMH 구조</text><text x="1050" y="440">활동 연기</text></g>
<text x="600" y="560" font-size="32" fill="#2f6b0f" text-anchor="middle">싱가포르 연료 가격, 여전히 전쟁 전보다 60% 이상 높아</text>
<text x="60" y="655" font-size="28" fill="#5c6b40">출처: Reuters; Arab News</text></svg>
