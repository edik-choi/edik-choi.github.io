<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<text x="60" y="90" font-size="44" font-weight="bold" fill="#1a1a1a">Fewer crossings, still deadly</text>
<rect x="60" y="130" width="1080" height="400" rx="16" fill="#eef6b0" stroke="#8a9560"/>
<text x="600" y="360" font-size="200" font-weight="bold" fill="#a14d12" text-anchor="middle">2,292</text>
<text x="600" y="430" font-size="38" fill="#1a1a1a" text-anchor="middle">people dead or missing on the crossing</text>
<text x="600" y="490" font-size="32" fill="#4a4a3a" text-anchor="middle">so far in 2026, at least</text>
