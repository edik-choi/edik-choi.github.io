<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Riyadh airport attack toll</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Houthi strikes on Saudi airports</text>
<rect x="60" y="130" width="500" height="380" rx="20" fill="#eef6b0" stroke="#8a9560" stroke-width="2"/>
<rect x="640" y="130" width="500" height="380" rx="20" fill="#eef6b0" stroke="#8a9560" stroke-width="2"/>
<text x="310" y="330" font-size="120" font-weight="700" text-anchor="middle" fill="#a14d12">19+</text>
<text x="310" y="400" font-size="34" text-anchor="middle" fill="#1a1a1a">people killed (Saudi</text><text x="310" y="445" font-size="34" text-anchor="middle" fill="#1a1a1a">authorities)</text>
<text x="890" y="330" font-size="120" font-weight="700" text-anchor="middle" fill="#2f6b0f">300+</text>
<text x="890" y="400" font-size="34" text-anchor="middle" fill="#1a1a1a">wounded in the 10 Oct</text><text x="890" y="445" font-size="34" text-anchor="middle" fill="#1a1a1a">strike on Riyadh airport</text>
<text x="600" y="580" font-size="30" text-anchor="middle" fill="#4a4a3a">Other counts reach 20 for 6-12 October</text>
<text x="60" y="650" font-size="28" fill="#5c6b40">Source: AP/PBS; UPI; CBS News</text>
</svg>
