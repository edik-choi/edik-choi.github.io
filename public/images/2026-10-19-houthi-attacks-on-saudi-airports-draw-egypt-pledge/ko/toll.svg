<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>리야드 공항 공격 피해</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">후티의 사우디 공항 공격</text>
<rect x="60" y="130" width="500" height="380" rx="20" fill="#eef6b0" stroke="#8a9560" stroke-width="2"/>
<rect x="640" y="130" width="500" height="380" rx="20" fill="#eef6b0" stroke="#8a9560" stroke-width="2"/>
<text x="310" y="330" font-size="120" font-weight="700" text-anchor="middle" fill="#a14d12">19+</text>
<text x="310" y="400" font-size="34" text-anchor="middle" fill="#1a1a1a">사망자 (사우디</text><text x="310" y="445" font-size="34" text-anchor="middle" fill="#1a1a1a">당국 집계)</text>
<text x="890" y="330" font-size="120" font-weight="700" text-anchor="middle" fill="#2f6b0f">300+</text>
<text x="890" y="400" font-size="34" text-anchor="middle" fill="#1a1a1a">부상자 (10월 10일</text><text x="890" y="445" font-size="34" text-anchor="middle" fill="#1a1a1a">리야드 공항 공격)</text>
<text x="600" y="580" font-size="30" text-anchor="middle" fill="#4a4a3a">10월 6~12일 사망자를 20명으로 집계한 보도도 있음</text>
<text x="60" y="650" font-size="28" fill="#5c6b40">출처: AP/PBS; UPI; CBS News</text>
