<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>확전 타임라인</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">2026년 7~10월의 확전</text>
<line x1="130" y1="330" x2="1070" y2="330" stroke="#8a9560" stroke-width="4"/>
<circle cx="130" cy="330" r="16" fill="#2f6b0f"/><circle cx="420" cy="330" r="16" fill="#2f6b0f"/><circle cx="720" cy="330" r="16" fill="#a14d12"/><circle cx="1070" cy="330" r="16" fill="#2f6b0f"/>
<text x="130" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">7월</text>
<text x="130" y="400" font-size="30" text-anchor="middle" fill="#1a1a1a">후티, 사우디</text><text x="130" y="440" font-size="30" text-anchor="middle" fill="#1a1a1a">공격 재개</text>
<text x="420" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">10월 6~12일</text>
<text x="420" y="400" font-size="30" text-anchor="middle" fill="#1a1a1a">공항 공격,</text><text x="420" y="440" font-size="30" text-anchor="middle" fill="#1a1a1a">20명 사망</text>
<text x="720" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#a14d12">10월 13일</text>
<text x="720" y="400" font-size="30" text-anchor="middle" fill="#1a1a1a">사우디 주도</text><text x="720" y="440" font-size="30" text-anchor="middle" fill="#1a1a1a">후티 석유시설 공습</text>
<text x="1070" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">10월 18일</text>
<text x="1070" y="400" font-size="30" text-anchor="middle" fill="#1a1a1a">이집트,</text><text x="1070" y="440" font-size="30" text-anchor="middle" fill="#1a1a1a">지원 약속</text>
<text x="60" y="650" font-size="28" fill="#5c6b40">출처: AP/PBS; CBS News; UPI</text>
</svg>
