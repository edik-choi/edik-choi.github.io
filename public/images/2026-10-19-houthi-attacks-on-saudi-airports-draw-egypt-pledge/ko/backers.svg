<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>사우디를 지원하는 나라들</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">사우디에 제시된 지원</text>
<rect x="60" y="120" width="520" height="210" rx="20" fill="#eef6b0" stroke="#a14d12" stroke-width="4"/>
<text x="320" y="185" font-size="38" font-weight="700" text-anchor="middle" fill="#a14d12">이집트</text>
<text x="320" y="240" font-size="30" text-anchor="middle" fill="#1a1a1a">"필요하고 가능한</text><text x="320" y="285" font-size="30" text-anchor="middle" fill="#1a1a1a">모든" 지원</text>
<rect x="620" y="120" width="520" height="210" rx="20" fill="#eef6b0" stroke="#8a9560" stroke-width="2"/>
<text x="880" y="185" font-size="38" font-weight="700" text-anchor="middle" fill="#2f6b0f">영국</text>
<text x="880" y="240" font-size="30" text-anchor="middle" fill="#1a1a1a">공중급유</text>
<rect x="60" y="360" width="520" height="210" rx="20" fill="#eef6b0" stroke="#8a9560" stroke-width="2"/>
<text x="320" y="425" font-size="38" font-weight="700" text-anchor="middle" fill="#2f6b0f">프랑스</text>
<text x="320" y="480" font-size="30" text-anchor="middle" fill="#1a1a1a">석유 수출 거점에</text><text x="320" y="525" font-size="30" text-anchor="middle" fill="#1a1a1a">병력·장비</text>
<rect x="620" y="360" width="520" height="210" rx="20" fill="#eef6b0" stroke="#8a9560" stroke-width="2"/>
<text x="880" y="425" font-size="38" font-weight="700" text-anchor="middle" fill="#2f6b0f">미국</text>
<text x="880" y="480" font-size="30" text-anchor="middle" fill="#1a1a1a">정보 제공. 후티</text><text x="880" y="525" font-size="30" text-anchor="middle" fill="#1a1a1a">공격은 거절</text>
<text x="60" y="640" font-size="28" fill="#5c6b40">출처: UPI</text>
</svg>
