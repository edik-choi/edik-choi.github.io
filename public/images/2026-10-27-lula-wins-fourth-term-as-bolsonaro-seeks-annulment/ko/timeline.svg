<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>1차 투표부터 취임까지</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">1차 투표부터 취임까지</text><line x1="150" y1="300" x2="1050" y2="300" stroke="#8a9560" stroke-width="4"/><circle cx="150" cy="300" r="22" fill="#2f6b0f"/><text x="150" y="240" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a">10월 4일</text><text x="150" y="370" font-size="30" font-weight="400" text-anchor="middle" fill="#4a4a3a">1차 투표</text><circle cx="450" cy="300" r="22" fill="#2f6b0f"/><text x="450" y="240" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a">10월 25일 19시</text><text x="450" y="370" font-size="30" font-weight="400" text-anchor="middle" fill="#4a4a3a">투표 연장</text><circle cx="750" cy="300" r="22" fill="#a14d12"/><text x="750" y="240" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a">10월 25일 21:47</text><text x="750" y="370" font-size="30" font-weight="400" text-anchor="middle" fill="#4a4a3a">룰라 승리 발표</text><circle cx="1050" cy="300" r="22" fill="#2f6b0f"/><text x="1050" y="240" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a">2027년 1월 5일</text><text x="1050" y="370" font-size="30" font-weight="400" text-anchor="middle" fill="#4a4a3a">취임 예정</text><text x="60" y="640" font-size="28" font-weight="400" text-anchor="start" fill="#5c6b40">출처: Latin Times, ABC News (AP)</text>
</svg>
