<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>초기 결과: 앨버타 주민투표 10번 문항</title>
<text x="600" y="75" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">초기 결과: 앨버타 주민투표 10번 문항</text>
<text x="600" y="330" font-size="200" font-weight="700" text-anchor="middle" fill="#2f6b0f">약 76%</text>
<text x="600" y="420" font-size="44" text-anchor="middle" fill="#1a1a1a">캐나다 잔류에 투표</text>
