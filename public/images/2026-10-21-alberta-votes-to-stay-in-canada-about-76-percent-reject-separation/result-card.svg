<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Early result: Alberta referendum, Question 10</title>
<text x="600" y="75" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Early result: Alberta referendum, Question 10</text>
<text x="600" y="330" font-size="200" font-weight="700" text-anchor="middle" fill="#2f6b0f">about 76%</text>
<text x="600" y="420" font-size="44" text-anchor="middle" fill="#1a1a1a">voted to remain in Canada</text>
<text x="600" y="510" font-size="36" text-anchor="middle" fill="#a14d12">about 24% backed starting the separation process</text>
<text x="600" y="570" font-size="30" text-anchor="middle" fill="#4a4a3a">Unofficial Elections Alberta count, October 19</text>
<text x="60" y="640" font-size="28" text-anchor="start" fill="#5c6b40">Source: Global News, NBC News</text>
</svg>
