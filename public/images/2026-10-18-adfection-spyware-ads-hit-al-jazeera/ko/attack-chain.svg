<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif" role="img" aria-label="Diagram of how an ad led to spyware"><rect width="100%" height="100%" fill="#f6fcbb"/>
<text x="600" y="70" text-anchor="middle" font-size="40" font-weight="bold" fill="#1a1a1a">광고를 통한 공격 과정</text>
<rect x="40" y="150" width="320" height="200" rx="12" fill="#eef6b0" stroke="#8a9560" stroke-width="2"/>
<text x="200" y="215" text-anchor="middle" font-size="34" font-weight="bold" fill="#1a1a1a">1. 광고 표시</text>
<text x="200" y="265" text-anchor="middle" font-size="30" fill="#4a4a3a">클릭 불필요</text>
<rect x="440" y="150" width="320" height="200" rx="12" fill="#eef6b0" stroke="#8a9560" stroke-width="2"/>
<text x="600" y="215" text-anchor="middle" font-size="34" font-weight="bold" fill="#1a1a1a">2. 서버 확인</text>
<text x="600" y="265" text-anchor="middle" font-size="30" fill="#4a4a3a">IP와 광고 ID</text>
<rect x="840" y="150" width="320" height="200" rx="12" fill="#eef6b0" stroke="#a14d12" stroke-width="3"/>
<text x="1000" y="215" text-anchor="middle" font-size="34" font-weight="bold" fill="#a14d12">3. 표적만</text>
<text x="1000" y="265" text-anchor="middle" font-size="30" fill="#4a4a3a">칸디루로 연결</text>
<line x1="365" y1="250" x2="435" y2="250" stroke="#2f6b0f" stroke-width="6"/>
<line x1="765" y1="250" x2="835" y2="250" stroke="#2f6b0f" stroke-width="6"/>
<text x="600" y="460" text-anchor="middle" font-size="34" fill="#1a1a1a">다른 기기에는 아무것도 전달되지 않아</text>
<text x="600" y="508" text-anchor="middle" font-size="34" fill="#1a1a1a">공격이 드러나지 않았다</text>
<text x="40" y="645" font-size="28" fill="#5c6b40">출처: BleepingComputer (Citizen Lab 인용)</text></svg>
