<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>패배 인정에서 새 의회까지</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">패배 인정에서 새 의회까지</text><line x1="100" y1="330" x2="1100" y2="330" stroke="#8a9560" stroke-width="4"/><circle cx="170" cy="330" r="16" fill="#a14d12"/><text x="170" y="270" font-size="32" font-weight="700" text-anchor="middle" fill="#a14d12">10월 25일</text><text x="170" y="395" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">투표 후</text><text x="170" y="433" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">부치치</text><text x="170" y="471" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">패배 인정</text><circle cx="457" cy="330" r="16" fill="#2f6b0f"/><text x="457" y="270" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">96시간 이내</text><text x="457" y="395" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">최종 결과</text><text x="457" y="433" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">발표</text><text x="457" y="471" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">(선관위)</text><circle cx="744" cy="330" r="16" fill="#2f6b0f"/><text x="744" y="270" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">이후 10일</text><text x="744" y="395" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">의석</text><text x="744" y="433" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">배분</text><text x="744" y="471" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">확정</text><circle cx="1031" cy="330" r="16" fill="#2f6b0f"/><text x="1031" y="270" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">126석</text><text x="1031" y="395" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">정부 구성에</text><text x="1031" y="433" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">필요한</text><text x="1031" y="471" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">과반</text><text x="60" y="640" font-size="28" font-weight="400" fill="#5c6b40">출처: Bernama</text>
</svg>
