<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Student List wins the vote</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Student List wins the vote</text><text x="600" y="115" font-size="30" font-weight="400" text-anchor="middle" fill="#4a4a3a">Share of vote, RIK count, 97% of polling stations</text><line x1="430" y1="150" x2="430" y2="560" stroke="#8a9560" stroke-width="3"/><text x="410" y="238" font-size="28" font-weight="400" text-anchor="end" fill="#1a1a1a">Student List</text><rect x="430" y="180" width="456" height="84" fill="#2f6b0f"/><text x="902" y="238" font-size="36" font-weight="700" text-anchor="start" fill="#2f6b0f">52.65%</text><text x="410" y="368" font-size="28" font-weight="400" text-anchor="end" fill="#1a1a1a">United Serbia</text><rect x="430" y="310" width="340" height="84" fill="#a14d12"/><text x="786" y="368" font-size="36" font-weight="700" text-anchor="start" fill="#a14d12">39.22%</text><text x="60" y="640" font-size="28" font-weight="400" fill="#5c6b40">Source: Bernama</text>
</svg>
