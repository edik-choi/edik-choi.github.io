<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>From concession to a new parliament</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">From concession to a new parliament</text><line x1="100" y1="330" x2="1100" y2="330" stroke="#8a9560" stroke-width="4"/><circle cx="170" cy="330" r="16" fill="#a14d12"/><text x="170" y="270" font-size="32" font-weight="700" text-anchor="middle" fill="#a14d12">25 Oct</text><text x="170" y="395" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">Vote and</text><text x="170" y="433" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">Vucic</text><text x="170" y="471" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">concedes</text><circle cx="457" cy="330" r="16" fill="#2f6b0f"/><text x="457" y="270" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">Within 96h</text><text x="457" y="395" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">Final results</text><text x="457" y="433" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">announced</text><text x="457" y="471" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">(RIK)</text><circle cx="744" cy="330" r="16" fill="#2f6b0f"/><text x="744" y="270" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">Then 10 days</text><text x="744" y="395" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">Seats</text><text x="744" y="433" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">distributed</text><text x="744" y="471" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">to lists</text><circle cx="1031" cy="330" r="16" fill="#2f6b0f"/><text x="1031" y="270" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">126 seats</text><text x="1031" y="395" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">Needed to</text><text x="1031" y="433" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">form a</text><text x="1031" y="471" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">government</text><text x="60" y="640" font-size="28" font-weight="400" fill="#5c6b40">Source: Bernama</text>
</svg>
