<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Piraeus port strike impact">
  <rect width="100%" height="100%" fill="#f6fcbb"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">
    <text x="60" y="92" font-size="42" fill="#4a4a3a">PIREAUS · GREECE · 30 OCT 2026</text>
    <text x="60" y="290" font-size="170" font-weight="700" fill="#2f6b0f">3,000</text>
    <text x="70" y="355" font-size="42" font-weight="700">dockworkers and seafarers joined</text>
    <rect x="60" y="425" width="520" height="125" rx="18" fill="#eef6b0" stroke="#8a9560" stroke-width="2"/>
    <text x="95" y="480" font-size="34" font-weight="700" fill="#a14d12">Cargo operations</text>
    <text x="95" y="525" font-size="34">disrupted</text>
    <rect x="620" y="425" width="520" height="125" rx="18" fill="#eef6b0" stroke="#8a9560" stroke-width="2"/>
    <text x="655" y="480" font-size="34" font-weight="700" fill="#a14d12">Island ferries</text>
    <text x="655" y="525" font-size="34">suspended</text>
  </g>
  <text x="60" y="635" font-size="28" fill="#5c6b40">Source: Reuters; AP</text>
</svg>