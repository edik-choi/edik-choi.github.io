<text x="600" y="90" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">The Abuja patient: key dates (Oct 2026)</text><line x1="100" y1="330" x2="1100" y2="330" stroke="#8a9560" stroke-width="4"/><circle cx="140" cy="330" r="16" fill="#2f6b0f"/><text x="140" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">Oct 3</text><text x="140" y="395" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">Arrives</text><text x="140" y="430" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">in Abuja</text><circle cx="370" cy="330" r="16" fill="#2f6b0f"/><text x="370" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">Oct 7</text><text x="370" y="395" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">Symptoms</text><text x="370" y="430" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">begin</text><circle cx="600" cy="330" r="16" fill="#2f6b0f"/><text x="600" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">Oct 11</text><text x="600" y="395" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">Seeks</text><text x="600" y="430" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">care</text><circle cx="830" cy="330" r="16" fill="#2f6b0f"/><text x="830" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">Oct 19</text><text x="830" y="395" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">Tested</text><text x="830" y="430" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">positive</text><circle cx="1060" cy="330" r="16" fill="#a14d12"/><text x="1060" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#a14d12">Oct 20</text><text x="1060" y="395" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">WHO</text><text x="1060" y="430" font-size="28" font-weight="400" text-anchor="middle" fill="#