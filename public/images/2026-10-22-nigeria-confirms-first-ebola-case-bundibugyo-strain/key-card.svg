<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Nigeria's first Ebola case</title>
<text x="600" y="90" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Nigeria's first Ebola case</text><text x="600" y="330" font-size="150" font-weight="700" text-anchor="middle" fill="#a14d12">5th</text><text x="600" y="420" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">fifth country to detect the virus</text><text x="600" y="490" font-size="34" font-weight="400" text-anchor="middle" fill="#2f6b0f">Bundibugyo strain, confirmed 20 Oct 2026</text><text x="600" y="550" font-size="32" font-weight="400" text-anchor="middle" fill="#4a4a3a">44 contacts identified and monitored</text>
<text x="60" y="640" font-size="28" text-anchor="start" fill="#5c6b40">Source: Al Jazeera, WHO</text>
</svg>
