<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Key dates, 15–20 October 2026</title>
<text x="600" y="75" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Key dates, 15–20 October 2026</text>
<line x1="150" y1="300" x2="1050" y2="300" stroke="#8a9560" stroke-width="4"/>
<circle cx="150" cy="300" r="22" fill="#2f6b0f"/>
<text x="150" y="230" font-size="40" font-weight="700" text-anchor="middle" fill="#2f6b0f">15 Oct</text>
<text x="150" y="375" font-size="30"  text-anchor="middle" fill="#1a1a1a">Zelensky: refinery</text>
<text x="150" y="415" font-size="30"  text-anchor="middle" fill="#1a1a1a">strikes resume</text>
<circle cx="450" cy="300" r="22" fill="#2f6b0f"/>
<text x="450" y="230" font-size="40" font-weight="700" text-anchor="middle" fill="#2f6b0f">18 Oct</text>
<text x="450" y="375" font-size="30"  text-anchor="middle" fill="#1a1a1a">Call with Trump's</text>
<text x="450" y="415" font-size="30"  text-anchor="middle" fill="#1a1a1a">representatives</text>
<circle cx="750" cy="300" r="22" fill="#2f6b0f"/>
<text x="750" y="230" font-size="40" font-weight="700" text-anchor="middle" fill="#2f6b0f">19 Oct</text>
<text x="750" y="375" font-size="30"  text-anchor="middle" fill="#1a1a1a">Senators briefed;</text>
<text x="750" y="415" font-size="30"  text-anchor="middle" fill="#1a1a1a">Trump replies</text>
<circle cx="1050" cy="300" r="22" fill="#a14d12"/>
<text x="1050" y="230" font-size="40" font-weight="700" text-anchor="middle" fill="#a14d12">20 Oct</text>
<text x="1050" y="375" font-size="30"  text-anchor="middle" fill="#1a1a1a">Oslo talks open</text>
<text x="1050" y="415" font-size="30"  text-anchor="middle" fill="#1a1a1a">with Witkoff</text>
<text x="60" y="640" font-size="28"  text-anchor="start" fill="#5c6b40">Source: Kyiv Post; Euromaidan Press</text>
</svg>
