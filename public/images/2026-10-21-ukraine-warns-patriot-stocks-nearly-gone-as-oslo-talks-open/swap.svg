<rect x="710" y="150" width="400" height="260" rx="24" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/>
<text x="290" y="225" font-size="40" font-weight="700" text-anchor="middle" fill="#2f6b0f">Ukraine</text>
<text x="290" y="300" font-size="32"  text-anchor="middle" fill="#1a1a1a">pauses refinery</text>
<text x="290" y="345" font-size="32"  text-anchor="middle" fill="#1a1a1a">strikes 30 days</text>
