<line x1="680" y1="310" x2="520" y2="310" stroke="#a14d12" stroke-width="6"/><polygon points="510,310 535,295 535,325" fill="#a14d12"/>
<text x="600" y="500" font-size="32"  text-anchor="middle" fill="#a14d12">Washington has shown no openness, Zelensky said</text>
<text x="60" y="640" font-size="28"  text-anchor="start" fill="#5c6b40">Source: Kyiv Post</text>
