<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Missed early warnings</title>
<text x="600" y="75" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Missed early warnings</text>
<rect x="150" y="120" width="900" height="420" rx="24" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/>
<text x="600" y="330" font-size="220" font-weight="700" text-anchor="middle" fill="#a14d12">3</text>
<text x="600" y="408" font-size="34"  text-anchor="middle" fill="#1a1a1a">times in one week, Zelensky said,</text>
<text x="600" y="455" font-size="34"  text-anchor="middle" fill="#1a1a1a">Ukraine got no US warning</text>
<text x="600" y="502" font-size="34"  text-anchor="middle" fill="#1a1a1a">of Russian ballistic launches</text>
<text x="60" y="640" font-size="28"  text-anchor="start" fill="#5c6b40">Source: Euromaidan Press</text>
</svg>
