<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>누락된 조기 경보</title>
<text x="600" y="75" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">누락된 조기 경보</text>
<rect x="150" y="120" width="900" height="420" rx="24" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/>
<text x="600" y="330" font-size="220" font-weight="700" text-anchor="middle" fill="#a14d12">3</text>
<text x="600" y="408" font-size="34"  text-anchor="middle" fill="#1a1a1a">젤렌스키에 따르면 일주일 새 3차례</text>
<text x="600" y="455" font-size="34"  text-anchor="middle" fill="#1a1a1a">러시아 탄도미사일 발사에 대한</text>
