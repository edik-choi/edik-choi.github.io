<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Missiles in one overnight Russian attack</title>
<text x="600" y="75" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Missiles in one overnight Russian attack</text>
<line x1="300" y1="150" x2="300" y2="470" stroke="#8a9560" stroke-width="3"/>
<text x="280" y="235" font-size="32"  text-anchor="end" fill="#1a1a1a">Ballistic</text>
<text x="280" y="375" font-size="32"  text-anchor="end" fill="#1a1a1a">Cruise</text>
<rect x="300" y="180" width="700" height="80" fill="#a14d12"/>
<rect x="300" y="320" width="262" height="80" fill="#2f6b0f"/>
<text x="1020" y="238" font-size="48" font-weight="700" text-anchor="start" fill="#a14d12">16</text>
<text x="582" y="378" font-size="48" font-weight="700" text-anchor="start" fill="#2f6b0f">6</text>
<text x="600" y="550" font-size="32"  text-anchor="middle" fill="#4a4a3a">Reported by Zelensky, night of 18–19 October</text>
<text x="60" y="640" font-size="28"  text-anchor="start" fill="#5c6b40">Source: Kyiv Post</text>
</svg>
