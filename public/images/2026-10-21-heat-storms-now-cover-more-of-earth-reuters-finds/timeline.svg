<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">A changing pattern</title>
  <desc id="desc">1960s: about 5 heat storms per year July 6, 2008: an ongoing cascade begins 2023–24: Vera lasts 367 days 2026: Raimundo reaches nearly 75% of Earth</desc>
  <rect width="100%" height="100%" fill="#f6fcbb"/>
  <text x="70" y="95" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#1a1a1a">A changing pattern</text>
  <line x1="70" y1="125" x2="1130" y2="125" stroke="#8a9560" stroke-width="2"/>
  <text x="70" y="190" font-size="38" fill="#1a1a1a">1960s: about 5 heat storms per year</text>
  <text x="70" y="285" font-size="38" fill="#1a1a1a">July 6, 2008: an ongoing cascade begins</text>
  <text x="70" y="380" font-size="38" fill="#1a1a1a">2023–24: Vera lasts 367 days</text>
  <text x="70" y="475" font-size="38" fill="#1a1a1a">2026: Raimundo reaches nearly 75% of Earth</text>
  <rect x="65" y="520" width="1070" height="1" fill="#8a9560"/>
  <text x="70" y="570" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#5c6b40">Source: Reuters analysis</text>
</svg>
