<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">변화하는 양상</title>
  <desc id="desc">1960년대: 연평균 열 폭풍 약 5건 2008.7.6: 중단 없는 연쇄 시작 2023–24년: 베라가 367일 지속 2026년: 라이문도가 지구의 약 75%에 영향</desc>
  <rect width="100%" height="100%" fill="#f6fcbb"/>
  <text x="70" y="95" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#1a1a1a">변화하는 양상</text>
  <line x1="70" y1="125" x2="1130" y2="125" stroke="#8a9560" stroke-width="2"/>
  <text x="70" y="190" font-size="38" fill="#1a1a1a">1960년대: 연평균 열 폭풍 약 5건</text>
  <text x="70" y="285" font-size="38" fill="#1a1a1a">2008.7.6: 중단 없는 연쇄 시작</text>
  <text x="70" y="380" font-size="38" fill="#1a1a1a">2023–24년: 베라가 367일 지속</text>
  <text x="70" y="475" font-size="38" fill="#1a1a1a">2026년: 라이문도가 지구의 약 75%에 영향</text>
  <rect x="65" y="520" width="1070" height="1" fill="#8a9560"/>
  <text x="70" y="570" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif" font-size="28" fill="#5c6b40">Source: Reuters analysis</text>
</svg>
