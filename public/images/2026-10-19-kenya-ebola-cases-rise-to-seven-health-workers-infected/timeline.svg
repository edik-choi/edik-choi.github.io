<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Timeline of Kenya's Ebola cases</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Two weeks from one case to seven</text>
<line x1="130" y1="330" x2="1070" y2="330" stroke="#8a9560" stroke-width="4"/>
<circle cx="130" cy="330" r="16" fill="#2f6b0f"/><circle cx="400" cy="330" r="16" fill="#2f6b0f"/><circle cx="670" cy="330" r="16" fill="#2f6b0f"/><circle cx="870" cy="330" r="16" fill="#2f6b0f"/><circle cx="1070" cy="330" r="16" fill="#a14d12"/>
<text x="130" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">3 Oct</text>
<text x="130" y="400" font-size="30" text-anchor="middle" fill="#1a1a1a">Patient 1 flies</text><text x="130" y="440" font-size="30" text-anchor="middle" fill="#1a1a1a">to Nairobi</text>
<text x="400" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">5 Oct</text>
<text x="400" y="400" font-size="30" text-anchor="middle" fill="#1a1a1a">Patient 1</text><text x="400" y="440" font-size="30" text-anchor="middle" fill="#1a1a1a">dies</text>
<text x="670" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">6 Oct</text>
<text x="670" y="400" font-size="30" text-anchor="middle" fill="#1a1a1a">Relative</text><text x="670" y="440" font-size="30" text-anchor="middle" fill="#1a1a1a">quarantined</text>
<text x="870" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">16 Oct</text>
<text x="870" y="400" font-size="30" text-anchor="middle" fill="#1a1a1a">Third case</text><text x="870" y="440" font-size="30" text-anchor="middle" fill="#1a1a1a">confirmed</text>
<text x="1070" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#a14d12">17 Oct</text>
<text x="1070" y="400" font-size="30" text-anchor="middle" fill="#1a1a1a">4 more:</text><text x="1070" y="440" font-size="30" text-anchor="middle" fill="#1a1a1a">total 7</text>
<text x="60" y="650" font-size="28" fill="#5c6b40">Source: Al Jazeera</text>
</svg>
