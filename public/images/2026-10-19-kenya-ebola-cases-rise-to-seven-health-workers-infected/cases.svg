<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Kenya confirmed Ebola cases</title>
<text x="600" y="75" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Confirmed Ebola cases in Kenya</text>
<rect x="150" y="120" width="900" height="400" rx="24" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/>
<text x="600" y="340" font-size="220" font-weight="700" text-anchor="middle" fill="#a14d12">7</text>
<text x="600" y="420" font-size="36" text-anchor="middle" fill="#1a1a1a">as of 17 October 2026</text>
<text x="600" y="480" font-size="32" text-anchor="middle" fill="#4a4a3a">incl. 3 health workers and a relative of patient 1</text>
<text x="60" y="640" font-size="28" fill="#5c6b40">Source: Al Jazeera; ABC News (AP)</text>
</svg>
