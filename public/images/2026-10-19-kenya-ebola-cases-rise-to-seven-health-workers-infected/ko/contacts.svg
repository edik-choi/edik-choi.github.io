<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>접촉자 격리율과 국제 기준</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">격리된 접촉자 비율</text>
<text x="80" y="200" font-size="32" fill="#1a1a1a">케냐: 접촉자 130명 중 128명</text>
<rect x="80" y="225" width="984" height="80" fill="#eef6b0" stroke="#8a9560" stroke-width="2"/>
<rect x="80" y="225" width="969" height="80" fill="#2f6b0f"/>
<text x="1060" y="350" font-size="36" font-weight="700" text-anchor="end" fill="#2f6b0f">98.5%</text>
<text x="80" y="420" font-size="32" fill="#1a1a1a">전파 차단을 위한 국제 기준</text>
