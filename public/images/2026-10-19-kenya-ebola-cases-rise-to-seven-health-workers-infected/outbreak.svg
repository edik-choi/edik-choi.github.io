<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>DRC outbreak totals</title>
<text x="600" y="75" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">The wider outbreak, since May</text>
<rect x="80" y="130" width="500" height="380" rx="24" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/>
