<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/><text x="60" y="75" font-size="40" font-weight="bold" fill="#1a1a1a" text-anchor="start">Who says what</text><g stroke="#8a9560" stroke-width="2"><line x1="460" y1="320" x2="430" y2="290"/><line x1="740" y1="320" x2="770" y2="290"/><line x1="460" y1="360" x2="430" y2="390"/><line x1="740" y1="360" x2="770" y2="390"/></g><rect x="50" y="110" width="380" height="180" rx="14" fill="#eef6b0" stroke="#2f6b0f" stroke-width="3"/><text x="74" y="158" font-size="32" font-weight="bold" fill="#2f6b0f" text-anchor="start">Germany</text><text x="74" y="202" font-size="28" font-weight="normal" fill="#1a1a1a" text-anchor="start">Prosecuting; the only</text><text x="74" y="237" font-size="28" font-weight="normal" fill="#1a1a1a" text-anchor="start">country still pursuing it</text><rect x="770" y="110" width="380" height="180" rx="14" fill="#eef6b0" stroke="#4a4a3a" stroke-width="3"/><text x="794" y="158" font-size="32" font-weight="bold" fill="#4a4a3a" text-anchor="start">Serhii K.</text><text x="794" y="202" font-size="28" font-weight="normal" fill="#1a1a1a" text-anchor="start">Ex-Ukrainian officer;</text><text x="794" y="237" font-size="28" font-weight="normal" fill="#1a1a1a" text-anchor="start">denies involvement</text><rect x="50" y="390" width="380" height="180" rx="14" fill="#eef6b0" stroke="#a14d12" stroke-width="3"/><text x="74" y="438" font-size="32" font-weight="bold" fill="#a14d12" text-anchor="start">Ukraine</text><text x="74" y="482" font-size="28" font-weight="normal" fill="#1a1a1a" text-anchor="start">Government denies</text><text x="74" y="517" font-size="28" font-weight="normal" fill="#1a1a1a" text-anchor="start">involvement</text><rect x="770" y="390" width="380" height="180" rx="14" fill="#eef6b0" stroke="#a14d12" stroke-width="3"/><text x="794" y="438" font-size="32" font-weight="bold" fill="#a14d12" text-anchor="start">Russia</text><text x="794" y="482" font-size="28" font-weight="normal" fill="#1a1a1a" text-anchor="start">Denies role; expects</text><text x="794" y="517" font-size="28" font-weight="normal" fill="#1a1a1a" text-anchor="start">a &quot;just verdict&quot;</text><rect x="460" y="300" width="280" height="80" rx="40" fill="#2f6b0f"/><text x="600" y="352" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">Hamburg trial</text><text x="60" y="635" font-size="28" font-weight="normal" fill="#5c6b40" text-anchor="start">Source: Al Jazeera; Kyiv Independent</text></svg>