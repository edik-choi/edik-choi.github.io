<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/><text x="60" y="80" font-size="40" font-weight="bold" fill="#1a1a1a" text-anchor="start">What the 2022 blasts hit</text><text x="320" y="300" font-size="120" font-weight="bold" fill="#2f6b0f" text-anchor="middle">3 of 4</text><text x="320" y="370" font-size="30" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Nord Stream pipelines</text><text x="320" y="410" font-size="30" font-weight="normal" fill="#1a1a1a" text-anchor="middle">ruptured</text><line x1="600" y1="180" x2="600" y2="460" stroke="#d3df8a" stroke-width="2"/><text x="880" y="300" font-size="100" font-weight="bold" fill="#a14d12" text-anchor="middle">About half</text><text x="880" y="370" font-size="30" font-weight="normal" fill="#1a1a1a" text-anchor="middle">of Germany's gas imports</text><text x="880" y="410" font-size="30" font-weight="normal" fill="#1a1a1a" text-anchor="middle">came via Nord Stream 1</text><text x="60" y="635" font-size="28" font-weight="normal" fill="#5c6b40" text-anchor="start">Source: Al Jazeera</text></svg>