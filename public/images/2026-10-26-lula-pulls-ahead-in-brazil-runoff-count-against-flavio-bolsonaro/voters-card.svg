<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Registered voters</title>
<rect x="150" y="100" width="900" height="420" rx="24" fill="#eef6b0" stroke="#2f6b0f" stroke-width="4"/><text x="600" y="190" font-size="40" font-weight="700" text-anchor="middle" fill="#4a4a3a">Registered voters</text><text x="600" y="360" font-size="120" font-weight="700" text-anchor="middle" fill="#2f6b0f">158 million</text><text x="600" y="440" font-size="32" font-weight="400" text-anchor="middle" fill="#1a1a1a">Brazilians eligible to vote in the run-off</text><text x="600" y="490" font-size="28" font-weight="400" text-anchor="middle" fill="#4a4a3a">Voting is compulsory for most adults</text><text x="60" y="640" font-size="28" font-weight="400" text-anchor="start" fill="#5c6b40">Source: Rio Times</text>
</svg>
