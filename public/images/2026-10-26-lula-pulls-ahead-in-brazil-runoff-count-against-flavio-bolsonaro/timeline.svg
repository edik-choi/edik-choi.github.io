<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Key dates</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Key dates</text><line x1="100" y1="330" x2="1100" y2="330" stroke="#8a9560" stroke-width="4"/><circle cx="140" cy="330" r="16" fill="#2f6b0f"/><text x="140" y="270" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">4 Oct</text><text x="140" y="400" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">First round</text><circle cx="370" cy="330" r="16" fill="#a14d12"/><text x="370" y="270" font-size="32" font-weight="700" text-anchor="middle" fill="#a14d12">25 Oct</text><text x="370" y="400" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">Run-off</text><circle cx="600" cy="330" r="16" fill="#2f6b0f"/><text x="600" y="270" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">4 Nov</text><text x="600" y="400" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">Rate decision</text><circle cx="830" cy="330" r="16" fill="#2f6b0f"/><text x="830" y="270" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">5 Jan</text><text x="830" y="400" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">Inauguration</text><circle cx="1060" cy="330" r="16" fill="#2f6b0f"/><text x="1060" y="270" font-size="32" font-weight="700" text-anchor="middle" fill="#2f6b0f">1 Feb</text><text x="1060" y="400" font-size="28" font-weight="400" text-anchor="middle" fill="#1a1a1a">New Congress</text><text x="60" y="640" font-size="28" font-weight="400" text-anchor="start" fill="#5c6b40">Source: Rio Times</text>
