<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Fed path to the October hold</title>
<text x="600" y="80" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Fed path to the October hold</text><line x1="130" y1="330" x2="1070" y2="330" stroke="#8a9540" stroke-width="4"/><circle cx="210" cy="330" r="16" fill="#2f6b0f"/><text x="210" y="270" font-size="36" font-weight="700" text-anchor="middle" fill="#2f6b0f">Sep 16</text><text x="210" y="400" font-size="30" font-weight="400" text-anchor="middle" fill="#1a1a1a">Fed hikes</text><text x="210" y="445" font-size="30" font-weight="400" text-anchor="middle" fill="#4a4a3a">to 3.75–4%, 12–0</text><circle cx="470" cy="330" r="16" fill="#2f6b0f"/><text x="470" y="270" font-size="36" font-weight="700" text-anchor="middle" fill="#2f6b0f">Oct 14</text><text x="470" y="400" font-size="30" font-weight="400" text-anchor="middle" fill="#1a1a1a">CPI 3.7% in Sep</text><text x="470" y="445" font-size="30" font-weight="400" text-anchor="middle" fill="#4a4a3a">vs 3.6% expected</text><circle cx="730" cy="330" r="16" fill="#2f6b0f"/><text x="730" y="270" font-size="36" font-weight="700" text-anchor="middle" fill="#2f6b0f">Oct 28</text><text x="730" y="400" font-size="30" font-weight="400" text-anchor="middle" fill="#1a1a1a">Fed holds</text><text x="730" y="445" font-size="30" font-weight="400" text-anchor="middle" fill="#4a4a3a">10–2 vote</text><circle cx="990" cy="330" r="16" fill="#a14d12"/><text x="990" y="270" font-size="36" font-weight="700" text-anchor="middle" fill="#a14d12">Dec 9</text><text x="990" y="400" font-size="30" font-weight="400" text-anchor="middle" fill="#1a1a1a">Next meeting</text><text x="990" y="445" font-size="30" font-weight="400" text-anchor="middle" fill="#4a4a3a">hike odds ~85%</text><text x="60" y="640" font-size="28" font-weight="400" text-anchor="start" fill="#5c6b40">Source: Federal Reserve, investinglive, Yahoo Finance</text>
</svg>
