<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>선거인 명부 갈등 타임라인</title>
<text x="600" y="75" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">비하르에서 전국 시위까지</text>
<line x1="120" y1="330" x2="1080" y2="330" stroke="#8a9560" stroke-width="4"/>
<circle cx="160" cy="330" r="16" fill="#2f6b0f"/><circle cx="400" cy="330" r="16" fill="#2f6b0f"/><circle cx="640" cy="330" r="16" fill="#2f6b0f"/><circle cx="880" cy="330" r="16" fill="#2f6b0f"/><circle cx="1060" cy="330" r="16" fill="#a14d12"/>
<text x="160" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">2025년</text>
<text x="160" y="395" font-size="30" text-anchor="middle" fill="#1a1a1a">비하르에서</text><text x="160" y="432" font-size="30" text-anchor="middle" fill="#1a1a1a">재정비 시작</text>
<text x="400" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">2026년 여름</text>
<text x="400" y="395" font-size="30" text-anchor="middle" fill="#1a1a1a">대법원,</text><text x="400" y="432" font-size="30" text-anchor="middle" fill="#1a1a1a">절차 인정</text>
<text x="640" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">10월 4일</text>
<text x="640" y="395" font-size="30" text-anchor="middle" fill="#1a1a1a">뭄바이 선관위</text><text x="640" y="432" font-size="30" text-anchor="middle" fill="#1a1a1a">규탄 시위</text>
<text x="880" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">10월 12일</text>
<text x="880" y="395" font-size="30" text-anchor="middle" fill="#1a1a1a">대법원을</text><text x="880" y="432" font-size="30" text-anchor="middle" fill="#1a1a1a">향해 행진</text>
<text x="1040" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#a14d12">10월 16일</text>
<text x="1040" y="395" font-size="30" text-anchor="middle" fill="#a14d12">양보안</text><text x="1040" y="432" font-size="30" text-anchor="middle" fill="#a14d12">발표</text>
<text x="120" y="620" font-size="28" fill="#5c6b40">출처: NBC News; TIME; The Hans India</text>
</svg>
