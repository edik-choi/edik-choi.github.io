<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>선거인 명부 삭제 비율</title>
<text x="600" y="80" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">명부는 얼마나 사라질 수 있나</text>
<line x1="150" y1="540" x2="1100" y2="540" stroke="#8a9560" stroke-width="2"/>
<rect x="250" y="408" width="280" height="132" fill="#2f6b0f"/>
<text x="390" y="385" font-size="48" font-weight="700" text-anchor="middle" fill="#2f6b0f">~12%</text>
<text x="390" y="590" font-size="30" text-anchor="middle" fill="#1a1a1a">서벵골</text>
<rect x="670" y="210" width="280" height="330" fill="#a14d12"/>
<text x="810" y="188" font-size="48" font-weight="700" text-anchor="middle" fill="#a14d12">최대 30%</text>
<text x="810" y="590" font-size="30" text-anchor="middle" fill="#1a1a1a">일부 지역 명부</text>
<text x="150" y="640" font-size="28" fill="#5c6b40">출처: NBC News (서벵골 약 900만 명, 지역 명부는 선관위 자료)</text>
</svg>
