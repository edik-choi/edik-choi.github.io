<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>핵심 수치: 인도 선거인 명부에서 1억 3,000만 명 이상 삭제</title>
<rect x="100" y="90" width="1000" height="430" rx="24" fill="#eef6b0" stroke="#8a9560" stroke-width="2"/>
<text x="600" y="150" font-size="36" text-anchor="middle" fill="#4a4a3a">인도 선거인 명부 특별 집중 재정비</text>
<text x="600" y="350" font-size="190" font-weight="700" text-anchor="middle" fill="#2f6b0f">1.3억</text>
<text x="600" y="425" font-size="40" text-anchor="middle" fill="#1a1a1a">선거인 명부에서 삭제된 것으로 보도된 인원</text>
<text x="600" y="485" font-size="32" text-anchor="middle" fill="#a14d12">보도 수치(13크로르). 선관위는 중복 항목이라고 설명</text>
<text x="100" y="620" font-size="28" fill="#5c6b40">출처: The Hans India; TIME</text>
</svg>
