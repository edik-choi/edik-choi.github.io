<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Timeline of the voter roll dispute</title>
<text x="600" y="75" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">From Bihar to nationwide protests</text>
<line x1="120" y1="330" x2="1080" y2="330" stroke="#8a9560" stroke-width="4"/>
<circle cx="160" cy="330" r="16" fill="#2f6b0f"/><circle cx="400" cy="330" r="16" fill="#2f6b0f"/><circle cx="640" cy="330" r="16" fill="#2f6b0f"/><circle cx="880" cy="330" r="16" fill="#2f6b0f"/><circle cx="1060" cy="330" r="16" fill="#a14d12"/>
<text x="160" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">2025</text>
<text x="160" y="395" font-size="30" text-anchor="middle" fill="#1a1a1a">Revision</text><text x="160" y="432" font-size="30" text-anchor="middle" fill="#1a1a1a">starts in Bihar</text>
<text x="400" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">Summer 2026</text>
<text x="400" y="395" font-size="30" text-anchor="middle" fill="#1a1a1a">Supreme Court</text><text x="400" y="432" font-size="30" text-anchor="middle" fill="#1a1a1a">upholds it</text>
<text x="640" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">4 Oct</text>
<text x="640" y="395" font-size="30" text-anchor="middle" fill="#1a1a1a">Mumbai protest</text><text x="640" y="432" font-size="30" text-anchor="middle" fill="#1a1a1a">vs Commission</text>
<text x="880" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#2f6b0f">12 Oct</text>
<text x="880" y="395" font-size="30" text-anchor="middle" fill="#1a1a1a">March toward</text><text x="880" y="432" font-size="30" text-anchor="middle" fill="#1a1a1a">Supreme Court</text>
<text x="1040" y="270" font-size="34" font-weight="700" text-anchor="middle" fill="#a14d12">16 Oct</text>
<text x="1040" y="395" font-size="30" text-anchor="middle" fill="#a14d12">Concessions</text><text x="1040" y="432" font-size="30" text-anchor="middle" fill="#a14d12">announced</text>
<text x="120" y="620" font-size="28" fill="#5c6b40">Source: NBC News; TIME; The Hans India</text>
</svg>
