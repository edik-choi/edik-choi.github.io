<text x="910" y="245" font-size="30" text-anchor="middle" fill="#1a1a1a">Deny wrongdoing; say</text><text x="910" y="285" font-size="30" text-anchor="middle" fill="#1a1a1a">it removes duplicate</text><text x="910" y="325" font-size="30" text-anchor="middle" fill="#1a1a1a">and ineligible entries</text>
<line x1="520" y1="280" x2="680" y2="280" stroke="#a14d12" stroke-width="4" stroke-dasharray="12 8"/>
<text x="600" y="262" font-size="30" text-anchor="middle" fill="#a14d12">disputed</text>
