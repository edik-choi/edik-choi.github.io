<title>Actors in the dispute</title>
<text x="600" y="70" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Who says what</text>
<rect x="60" y="130" width="460" height="300" rx="20" fill="#eef6b0" stroke="#8a9560" stroke-width="2"/>
<text x="290" y="190" font-size="36" font-weight="700" text-anchor="middle" fill="#2f6b0f">Opposition, youth</text>
<text x="290" y="245" font-size="30" text-anchor="middle" fill="#1a1a1a">Seek resignation of</text><text x="290" y="285" font-size="30" text-anchor="middle" fill="#1a1a1a">Gyanesh Kumar and</text><text x="290" y="325" font-size="30" text-anchor="middle" fill="#1a1a1a">an end to the revision</text>
<rect x="680" y="130" width="460" height="300" rx="20" fill="#eef6b0" stroke="#8a9560" stroke-width="2"/>
