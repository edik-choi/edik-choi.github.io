<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Key figure: more than 130 million names removed from India's voter rolls</title>
<rect x="100" y="90" width="1000" height="430" rx="24" fill="#eef6b0" stroke="#8a9560" stroke-width="2"/>
<text x="600" y="150" font-size="36" text-anchor="middle" fill="#4a4a3a">India's Special Intensive Revision</text>
<text x="600" y="350" font-size="190" font-weight="700" text-anchor="middle" fill="#2f6b0f">130M</text>
<text x="600" y="425" font-size="40" text-anchor="middle" fill="#1a1a1a">names reported removed from voter rolls</text>
<text x="600" y="485" font-size="32" text-anchor="middle" fill="#a14d12">Figure as reported (13 crore); the Commission calls them duplicates</text>
<text x="100" y="620" font-size="28" fill="#5c6b40">Source: The Hans India; TIME</text>
</svg>
