<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Share of voter rolls removed</title>
<text x="600" y="80" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">How much of a voter list can disappear</text>
<line x1="150" y1="540" x2="1100" y2="540" stroke="#8a9560" stroke-width="2"/>
<rect x="250" y="408" width="280" height="132" fill="#2f6b0f"/>
<text x="390" y="385" font-size="48" font-weight="700" text-anchor="middle" fill="#2f6b0f">~12%</text>
<text x="390" y="590" font-size="30" text-anchor="middle" fill="#1a1a1a">West Bengal</text>
<rect x="670" y="210" width="280" height="330" fill="#a14d12"/>
<text x="810" y="188" font-size="48" font-weight="700" text-anchor="middle" fill="#a14d12">up to 30%</text>
<text x="810" y="590" font-size="30" text-anchor="middle" fill="#1a1a1a">Some regional lists</text>
<text x="150" y="640" font-size="28" fill="#5c6b40">Source: NBC News (West Bengal: about 9 million names; regional: Commission data)</text>
</svg>
