<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<text x="60" y="70" font-size="40" font-weight="bold" fill="#1a1a1a">First round, 4 October: votes (millions)</text>
<text x="60" y="112" font-size="28" fill="#4a4a3a">Electoral court figures, nearly 99% counted</text>
<text x="60" y="230" font-size="32" fill="#1a1a1a">Flavio Bolsonaro</text>
<rect x="400" y="190" width="560" height="60" fill="#a14d12"/><text x="974" y="232" font-size="32" fill="#1a1a1a">about 56 (47%)</text>
