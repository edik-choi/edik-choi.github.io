<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Knesset seats needed for a majority</title>
<text x="600" y="75" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Knesset seats needed for a majority</text><rect x="150" y="130" width="900" height="440" rx="24" fill="#eef6b0" stroke="#8a9560" stroke-width="3"/><text x="600" y="330" font-size="170" font-weight="700" text-anchor="middle" fill="#2f6b0f">61</text><text x="600" y="405" font-size="36" font-weight="400" text-anchor="middle" fill="#1a1a1a">of 120 seats are needed to govern</text><text x="600" y="470" font-size="30" font-weight="700" text-anchor="middle" fill="#a14d12">May polls: coalition ~50, opposition ~60</text><text x="600" y="525" font-size="30" font-weight="400" text-anchor="middle" fill="#4a4a3a">Arab parties ~10, so neither camp reaches 61</text><text x="60" y="640" font-size="28" font-weight="400" text-anchor="start" fill="#5c6b40">Source: The Irish Times</text>
</svg>
