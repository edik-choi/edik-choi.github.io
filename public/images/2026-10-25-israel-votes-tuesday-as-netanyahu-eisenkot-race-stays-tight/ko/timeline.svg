<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>연정 위기에서 총선까지</title>
<text x="600" y="75" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">연정 위기에서 총선까지</text><line x1="290" y1="130" x2="290" y2="590" stroke="#8a9560" stroke-width="3"/><text x="260" y="180" font-size="32" font-weight="700" text-anchor="end" fill="#a14d12">2022년 12월</text><circle cx="290" cy="170" r="12" fill="#2f6b0f"/><text x="325" y="180" font-size="30" font-weight="400" text-anchor="start" fill="#1a1a1a">리쿠드, 하레디 징병법 약속</text><text x="260" y="280" font-size="32" font-weight="700" text-anchor="end" fill="#a14d12">2월 28일</text><circle cx="290" cy="270" r="12" fill="#2f6b0f"/><text x="325" y="280" font-size="30" font-weight="400" text-anchor="start" fill="#1a1a1a">미·이스라엘-이란 전쟁 시작</text><text x="260" y="380" font-size="32" font-weight="700" text-anchor="end" fill="#a14d12">5월</text><circle cx="290" cy="370" r="12" fill="#2f6b0f"/><text x="325" y="380" font-size="30" font-weight="400" text-anchor="start" fill="#1a1a1a">UTJ 이탈, 의회 해산 추진</text><text x="260" y="480" font-size="32" font-weight="700" text-anchor="end" fill="#a14d12">10월 24일</text><circle cx="290" cy="470" r="12" fill="#2f6b0f"/><text x="325" y="480" font-size="30" font-weight="400" text-anchor="start" fill="#1a1a1a">텔아비브 反정부 집회</text><text x="260" y="580" font-size="32" font-weight="700" text-anchor="end" fill="#a14d12">10월 27일</text><circle cx="290" cy="570" r="12" fill="#a14d12"/><text x="325" y="580" font-size="30" font-weight="400" text-anchor="start" fill="#1a1a1a">총선 투표</text><text x="60" y="640" font-size="28" font-weight="400" text-anchor="start" fill="#5c6b40">출처: The Irish Times, Times of Israel, Al Jazeera</text>
</svg>
