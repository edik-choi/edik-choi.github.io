<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>Haredi draft: orders vs. enlistment</title>
<text x="600" y="75" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">Haredi draft: orders vs. enlistment</text><text x="60" y="180" font-size="30" font-weight="400" text-anchor="start" fill="#1a1a1a">Conscription orders</text><rect x="460" y="150" width="600" height="50" fill="#2f6b0f"/><text x="1075" y="188" font-size="32" font-weight="700" text-anchor="start" fill="#1a1a1a">79,000</text><text x="60" y="295" font-size="30" font-weight="400" text-anchor="start" fill="#1a1a1a">Warned of evasion</text><rect x="460" y="265" width="379" height="50" fill="#2f6b0f"/><text x="854" y="303" font-size="32" font-weight="700" text-anchor="start" fill="#1a1a1a">50,000</text><text x="60" y="410" font-size="30" font-weight="400" text-anchor="start" fill="#1a1a1a">Classed as evaders</text><rect x="460" y="380" width="243" height="50" fill="#2f6b0f"/><text x="718" y="418" font-size="32" font-weight="700" text-anchor="start" fill="#1a1a1a">32,000</text><text x="60" y="525" font-size="30" font-weight="400" text-anchor="start" fill="#1a1a1a">Enlisted</text><rect x="460" y="495" width="15" height="50" fill="#a14d12"/><text x="490" y="533" font-size="32" font-weight="700" text-anchor="start" fill="#1a1a1a">2,100</text><text x="60" y="640" font-size="28" font-weight="400" text-anchor="start" fill="#5c6b40">Source: Times of Israel (IDF figures)</text>
</svg>
