<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#f6fcbb"/>
<title>From coalition crisis to the vote</title>
<text x="600" y="75" font-size="40" font-weight="700" text-anchor="middle" fill="#1a1a1a">From coalition crisis to the vote</text><line x1="290" y1="130" x2="290" y2="590" stroke="#8a9560" stroke-width="3"/><text x="260" y="180" font-size="32" font-weight="700" text-anchor="end" fill="#a14d12">Dec 2022</text><circle cx="290" cy="170" r="12" fill="#2f6b0f"/><text x="325" y="180" font-size="30" font-weight="400" text-anchor="start" fill="#1a1a1a">Likud promises Haredi draft law</text><text x="260" y="280" font-size="32" font-weight="700" text-anchor="end" fill="#a14d12">Feb 28</text><circle cx="290" cy="270" r="12" fill="#2f6b0f"/><text x="325" y="280" font-size="30" font-weight="400" text-anchor="start" fill="#1a1a1a">US-Israeli war with Iran begins</text><text x="260" y="380" font-size="32" font-weight="700" text-anchor="end" fill="#a14d12">May</text><circle cx="290" cy="370" r="12" fill="#2f6b0f"/><text x="325" y="380" font-size="30" font-weight="400" text-anchor="start" fill="#1a1a1a">UTJ quits; Knesset moves to dissolve</text><text x="260" y="480" font-size="32" font-weight="700" text-anchor="end" fill="#a14d12">24 Oct</text><circle cx="290" cy="470" r="12" fill="#2f6b0f"/><text x="325" y="480" font-size="30" font-weight="400" text-anchor="start" fill="#1a1a1a">Tel Aviv rally against government</text><text x="260" y="580" font-size="32" font-weight="700" text-anchor="end" fill="#a14d12">27 Oct</text><circle cx="290" cy="570" r="12" fill="#a14d12"/><text x="325" y="580" font-size="30" font-weight="400" text-anchor="start" fill="#1a1a1a">Israelis vote</text><text x="60" y="640" font-size="28" font-weight="400" text-anchor="start" fill="#5c6b40">Source: The Irish Times, Times of Israel, Al Jazeera</text>
</svg>
